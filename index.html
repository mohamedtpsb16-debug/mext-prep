<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEXT Prep</title>
<meta name="theme-color" content="#1E2A4A">
<meta name="apple-mobile-web-app-title" content="MEXT Prep">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="description" content="Préparation personnelle à la bourse MEXT : annales, cours, entretien.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: une colonne mobile façon carnet washi, encre indigo, accent sakura ; navigation basse fixe. */
:root{
  --paper:#F7F3EC; --card:#FFFFFF; --ink:#1E2A4A; --muted:#5B6178; --line:#E6DED0;
  --sakura:#C8475D; --sakura-soft:#FBE7EA; --indigo-soft:#E3E8F4; --good:#2E7D57; --good-soft:#E7F3EC; --warn:#9A6B12; --warn-soft:#F7EBCF;
  --hero:#1E2A4A; --hero-ink:#F7F3EC; --hero-muted:#C9CEDD; --hero-track:#36446B; --hero-bar:#F2B8C1;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12182B; --card:#1B2340; --ink:#EEF0F7; --muted:#A9B0C8; --line:#2C3658;
  --sakura:#F08A9B; --sakura-soft:#3A2233; --indigo-soft:#26305A; --good:#6FD3A0; --good-soft:#17372B; --warn:#F2C46B; --warn-soft:#3A3018;
  --hero:#26305A; --hero-ink:#F7F3EC; --hero-muted:#C9CEDD; --hero-track:#3B4877; --hero-bar:#F2B8C1; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#12182B; --card:#1B2340; --ink:#EEF0F7; --muted:#A9B0C8; --line:#2C3658;
  --sakura:#F08A9B; --sakura-soft:#3A2233; --indigo-soft:#26305A; --good:#6FD3A0; --good-soft:#17372B; --warn:#F2C46B; --warn-soft:#3A3018;
  --hero:#26305A; --hero-ink:#F7F3EC; --hero-muted:#C9CEDD; --hero-track:#3B4877; --hero-bar:#F2B8C1; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sakura);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:0 18px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:22px;gap:12px}
.hello small{display:block;color:var(--muted);font-size:13px}
.hello b{font-family:var(--display);font-size:26px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px;min-height:40px}
.pill svg{color:var(--sakura)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero .sun{position:absolute;right:-56px;top:-62px;width:140px;height:140px;border-radius:50%;background:var(--sakura);opacity:.9}
.hero>*{position:relative}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-muted)}
.big{font-family:var(--display);font-size:54px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--hero-track);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--hero-bar);border-radius:99px}
.lbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.lbar i{display:block;height:100%;background:var(--sakura);border-radius:99px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.steps div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--hero-muted)}
.steps b{display:block;color:var(--hero-ink);font-size:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h2{font-size:20px}.sec-h span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.row{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;min-height:64px}
.row .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-family:var(--display);font-size:19px}
.row .tx{flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row .tx b{font-size:15px}.row .tx span{font-size:13px;color:var(--muted)}
.row.done{opacity:.7}.row.done .ic{background:var(--good-soft)!important;color:var(--good)!important}
.ic.en{background:var(--sakura-soft);color:var(--sakura)}.ic.ja{background:var(--indigo-soft);color:var(--ink)}.ic.int{background:var(--warn-soft);color:var(--warn)}.ic.gen{background:var(--line);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink);min-height:96px;justify-content:center}
.tile .k{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;font-weight:800}
.tile small{color:var(--muted);font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{min-height:52px;border:none;border-radius:16px;background:var(--ink);color:var(--paper);font-weight:700;font-size:16px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.sak{background:var(--sakura);color:#fff}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px;padding:0 14px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1 1 140px}
.link{background:none;border:none;padding:0;color:var(--sakura);font-weight:700;font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.bottom button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);min-height:50px;justify-content:center}
nav.bottom button.on{color:var(--sakura);font-weight:700}
/* Quiz */
.qhead{display:flex;align-items:center;gap:12px;padding-top:20px}
.prog{flex-grow:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--sakura);border-radius:99px;transition:width .3s}
.tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--sakura);background:var(--sakura-soft);padding:5px 10px;border-radius:99px}
.qtext{font-family:var(--display);font-size:20px;line-height:1.7;font-weight:700;margin:0;white-space:pre-line}
.qtext.ja{font-size:21px;line-height:2.1}
.qtext.err{font-family:var(--body);font-size:16px;font-weight:500;line-height:1.8}
.seg{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--muted)}
.seg b{font-weight:800;color:var(--sakura);text-decoration:none;margin-right:2px}
.seg.bad{background:var(--sakura-soft);text-decoration-color:var(--sakura)}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink);margin:0 4px;vertical-align:baseline}
u{text-decoration-thickness:2px;text-underline-offset:4px}
rt{font-size:.5em;color:var(--muted);font-family:var(--body);font-weight:400}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;width:100%;text-align:left;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-size:16px;line-height:1.6}
.opt .l{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--paper);flex-shrink:0}
.opt.sel{border-color:var(--ink)}.opt.sel .l{background:var(--ink);color:var(--paper)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}.opt.ok .l{background:var(--good);color:#fff}
.opt.ko{background:var(--sakura-soft);border-color:var(--sakura)}.opt.ko .l{background:var(--sakura);color:#fff}
.opt:disabled{cursor:default}
.passage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0}
.passage summary{padding:14px;font-weight:700;cursor:pointer;min-height:44px;list-style:none;display:flex;justify-content:space-between}
.passage summary::-webkit-details-marker{display:none}
.passage .pt{padding:0 14px 14px;max-height:46vh;overflow:auto;white-space:pre-line;font-size:15px;line-height:1.75}
.passage .pt.ja{font-size:16px;line-height:2.1}
.hl{background:var(--sakura-soft);color:var(--sakura);font-weight:700;padding:0 4px;border-radius:6px}
.fb{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line)}
.fb.ok{border-color:var(--good)}.fb.ko{border-color:var(--sakura)}
.fb h3{font-family:var(--body);font-size:16px}
.fb.ok h3{color:var(--good)}.fb.ko h3{color:var(--sakura)}
.fix{font-size:14px;background:var(--paper);border-radius:10px;padding:8px 10px}
.grid10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.grid10 button{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--ink);padding:0}
.grid10 button.a{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid10 button.f{background:var(--warn-soft);border-color:var(--warn)}
.grid10 button.cur{outline:2px solid var(--sakura)}
.timer{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{background:var(--sakura)}
/* Lessons */
.lesson{font-size:15.5px;line-height:1.75}
.lesson h4{font-size:17px;margin:16px 0 6px}
.lesson table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.lesson td,.lesson th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.lesson th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.lesson ul,.lesson ol{padding-left:20px;margin:6px 0}
.tip{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
.tablewrap{overflow-x:auto}
/* Interview */
.bubble{display:flex;gap:12px;align-items:flex-start}
.bubble .av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;flex-shrink:0}
.bubble .b{background:var(--card);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bubble .b p{margin:0;font-size:17px;line-height:1.5;font-weight:500}
textarea{width:100%;min-height:150px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:14px;font-size:16px;line-height:1.6;resize:vertical}
input[type=text],input[type=date],select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:7px 11px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.chip.g{background:var(--good-soft);border-color:transparent;color:var(--good)}.chip.r{background:var(--sakura-soft);border-color:transparent;color:var(--sakura)}
.score{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mic{width:76px;height:76px;border-radius:50%;border:none;background:var(--sakura);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px var(--sakura-soft)}
.mic.on{background:var(--ink);box-shadow:0 0 0 8px var(--indigo-soft)}
.heat{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--line);display:block}
.heat i.l1{background:var(--sakura-soft)}.heat i.l2{background:#E9A3AF}.heat i.l3{background:var(--sakura)}
.flash{min-height:220px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;width:100%}
.flash .fr{font-family:var(--display);font-size:28px;font-weight:800}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;min-height:44px}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--sakura);flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90%}
.seg-tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:14px}
.seg-tabs button{flex:1;border:none;background:none;border-radius:10px;min-height:40px;font-size:14px;color:var(--muted);font-weight:700}
.seg-tabs button.on{background:var(--card);color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

#app{padding-top:env(safe-area-inset-top)}
</style>
</head>
<body>
<main id="app" aria-live="polite"><p style="padding:40px 0">Chargement de MEXT Prep…</p></main>
<script>
const EXAMS = [];
// 日本語 (A) 2025 — Research Students (文科系)
EXAMS.push({
id:"ja2025", subject:"ja", year:2025, title:"日本語 (A) 2025", minutes:100,
sections:[
{id:"I", title:"Grammaire et vocabulaire en contexte", instr:"＿＿に 入{はい}る いちばん てきとうな ものを A〜Dの 中{なか}から 一{ひと}つ えらびなさい。", pts:2, items:[
{q:"毎{まい}あさ、駅{えき}の 前{まえ}＿＿ とおります。", o:["で","と","に","を"], a:3, t:"particules", ex:"を marque le lieu que l'on traverse ou longe avec un verbe de mouvement (とおる, わたる, あるく). 駅の前を通る = passer devant la gare."},
{q:"パンに ＿＿を ぬって 食{た}べます。", o:["サンドイッチ","サラダ","ケーキ","ジャム"], a:3, t:"vocabulaire", ex:"ぬる = étaler, tartiner. On tartine de la confiture (ジャム) sur le pain."},
{q:"おもちゃの うりばは、＿＿に ありますか。", o:["何{なん}がい","何{なん}だい","何{なん}にん","何{なん}まい"], a:0, t:"compteurs", ex:"Le rayon jouets est à quel étage ? 〜階（がい／かい）compte les étages. だい = machines, にん = personnes, まい = objets plats."},
{q:"シャワーを ＿＿あとで、うたを うたいます。", o:["あび","あびた","あびて","あびる"], a:1, t:"formes verbales", ex:"〜たあとで = après avoir fait. Le verbe se met à la forme passée en た : あびたあとで."},
{q:"山田{やまだ}さんは ＿＿ 来{く}ると おもいます。", o:["しばらく","すっかり","そろそろ","だんだん"], a:2, t:"adverbes", ex:"そろそろ = bientôt, d'un moment à l'autre. しばらく = un moment, すっかり = complètement, だんだん = peu à peu."},
{q:"きのうの大雨{おおあめ}で川{かわ}の水{みず}が＿＿いる。", o:["にがして","にぎって","にごって","にらんで"], a:2, t:"vocabulaire", ex:"にごる（濁る）= devenir trouble. Après une forte pluie, l'eau de la rivière est trouble."},
{q:"となりの家{いえ}が＿＿、夜{よる}も寝{ね}られない。", o:["いさましくて","さわがしくて","そそっかしくて","はなはだしくて"], a:1, t:"adjectifs", ex:"さわがしい（騒がしい）= bruyant. La maison voisine est bruyante, impossible de dormir."},
{q:"全然運動{ぜんぜんうんどう}していないため、体重{たいじゅう}が増{ふ}える＿＿。", o:["一方{いっぽう}だ","せいだ","だらけだ","にすぎない"], a:0, t:"expressions N3-N2", ex:"〜一方だ = ne fait que (augmenter / diminuer), tendance qui continue dans un sens."},
{q:"先月{せんげつ}、給料{きゅうりょう}があがってうれしい＿＿、責任{せきにん}が重{おも}くなった。", o:["ことは","につけて","反面{はんめん}","ように"], a:2, t:"expressions N3-N2", ex:"〜反面 = d'un côté… mais de l'autre. Content de l'augmentation, mais la responsabilité est plus lourde."},
{q:"小学生{しょうがくせい}の娘{むすめ}は、みんなの前{まえ}で大{おお}きな声{こえ}で＿＿とスピーチできた。", o:["のろのろ","はきはき","ぶつぶつ","まごまご"], a:1, t:"onomatopées", ex:"はきはき = clairement, avec assurance. のろのろ = lentement, ぶつぶつ = marmonner, まごまご = être perdu."},
{q:"両親{りょうしん}に＿＿からでなければ、日本{にほん}に留学{りゅうがく}するかどうかを決{き}められない。", o:["相談{そうだん}した","相談{そうだん}して","相談{そうだん}しない","相談{そうだん}する"], a:1, t:"formes verbales", ex:"〜てからでなければ… ない = pas avant d'avoir fait. Forme en て + から."},
{q:"田中{たなか}さんの話{はな}すことと＿＿、自慢{じまん}ばかりだ。", o:["きたら","くるなら","くれば","こようと"], a:0, t:"expressions N2-N1", ex:"〜ときたら = quand il s'agit de… (avec une nuance de reproche). Ses paroles ? Que de la vantardise."},
{q:"我々{われわれ}は事件{じけん}の真相{しんそう}を＿＿、現場{げんば}に足{あし}を運{はこ}んだ。", o:["解明{かいめい}すべき","解明{かいめい}するごとき","解明{かいめい}すべく","解明{かいめい}するごとく"], a:2, t:"expressions N2-N1", ex:"〜べく = dans le but de (style écrit). On s'est rendu sur place pour élucider l'affaire."},

{id:"IV", title:"Compréhension d'un texte long", instr:"次{つぎ}の文章{ぶんしょう}を読{よ}んで、あとの問{と}いに答{こた}えなさい。", pts:4,
passage:"「時間どろぼう」という言葉を記憶している読者は多いだろう。ドイツの作家ミヒャエル・エンデ作『モモ』に出てくる言葉である。時間貯蓄銀行から派遣された灰色の男たちによって、人々の時間が盗まれていく。それをモモという少女が活躍してとりもどす。そのために彼女がとった手段は、ただ相手に会って話を聞くことだった。（１）[[このファンタジーは現代の日本で、ますます重要な意味をもちつつあるのではないだろうか]]。\n時間とは（２）[[記憶]]によって紡がれるものである。かつて距離は時間の関数だった。だから、遠い距離を旅した記憶は、かかった時間で表現された。「７日も歩いて着いた国」といえば、ずいぶん遠いところへ旅をしたことになった。その間に出会った多くの景色や人々は記憶のなかに時間の経過とともにならび、出発点と到着点を結ぶ物語となった。\nしかし、今は違う。東京の人々にとって飛行機で行く沖縄は、バスで行く名古屋より近い。移動手段の発達によって、距離は時間では測れなくなった。\n時間にとって代わったのは費用である。「時は金なり」ということわざは、もともと時間はお金と同じように貴重なものだから大切にしなければいけないという意味だった。ところが、次第に「時間は金で買えるもの」という意味に変わってきた。特急料金をはらえば、普通列車で行くより時間を短縮できる。速達郵便は普通郵便よりも料金が高いし、航空便は船便より費用がかさむ。同時に、距離も時間と同じように金に換算されて話題に上るようになった。\nしかし、（３）[[これ]]は大きな勘違いを生むもととなった。金は時間のように記憶によって蓄積できるものではない。本来、金は今ある可能性や価値を、劣化しない紙幣や硬貨に代えて、それを将来に担保する装置である。しかし、実はその持続性や普遍性は危うい約束事や予測の上に成り立っている。リーマン・ショックに代表される近年の金融危機は、そのことを如実に物語っている。\n時間には決して金に換算できない側面がある。たとえば、子どもが成長するには時間が必要だ。金をかければ、子どもの成長を物質的に豊かにできるかもしれないが、成長にかかる時間を短縮することはできない。そして、時間が紡ぎだす記憶を金に換算することもできないのだ。社会で生きていくための信頼を金で買えない理由がここにある。信頼は人々の間に生じた優しい記憶によって育てられ、維持されるからである。\n人々の信頼でつくられるネットワークを社会資本という。それは互いに顔と顔とを合わせ、時間をかけて話をすることによってつくられる。その時間は金では買えない。\n私はそれを、（４）[[野生のゴリラ]]との生活で学んだ。ゴリラはいつも仲間の顔が見える、まとまりのいい１０頭前後の群れで暮らしている。顔を見つめ合い、しぐさや表情で互いに感情の動きや意図を的確に読む。人間の最もまとまりのよい集団のサイズも１０〜１５人で、共鳴集団と呼ばれている。これも日常的に顔を合わせる関係によって築かれる。でも、信頼関係をつくるには視覚や接触によるコミュニケーションに勝るものはなく、言葉はそれを補助するにすぎない。\n人間が発する言葉は個性があり、声は身体と結びついている。だが、文字は言葉を身体から引き離し、劣化しない情報に変える。情報になれば、効率が重視されて金と相性がよくなる。本来、身体化されたコミュニケーションによって信頼関係をつくるために使ってきた時間を、今私たちは膨大な情報を読み、発信するために費やしている。フェイスブックやチャットを使って交信し、近況を報告し合う。（５）[[それは確かに仲間と会って話す時間を節約しているのだが、果たしてその機能を代用できているのだろうか]]。\n現代の私たちは、一日の大半をパソコンやスマホに向かって文字とつき合いながら過ごしている。もっと、人と顔を合わせ、話し、食べ、遊び、歌うことに使うべきなのではないだろうか。それこそが、モモがどろぼうたちからとりもどした時間だった。\n（山極寿一『ゴリラからの警告』より、一部表記を改めた）",
items:[
{q:"下線部（１）について、筆者がそのように考える理由として正しいものはどれですか。", o:["現代の日本では、モモが解決した「時間どろぼう」と同じことが実際の出来事として起こり始めているから。","現代の日本では、モモが時間をとりもどすために行ったのと同じ行動を取ることが求められ始めているから。","現代の日本では、『モモ』の世界と同じく、コミュニケーションを取ることの重要性が強調されているから。","現代の日本では、未来の人々に警告を発したファンタジー作品として、『モモ』が注目を集め始めているから。"], a:1, t:"lecture", ex:"Conclusion du texte : il faut se voir et se parler, comme Momo l'a fait pour reprendre le temps volé. C'est cette action qui devient nécessaire aujourd'hui."},
{q:"下線部（２）記憶について述べた文章として正しいものはどれですか。", o:["記憶に関係するものの中には、お金を使っても、効率化できないものがある。","記憶を共有した人の数が多いほど、人々の間の社会資本は強固なものになる。","距離と時間の関係が弱くなる中で、人々は旅行の記憶を大切にしなくなった。","時間が経つと、記憶は劣化するので、後からでは、役に立たないことがある。"], a:0, t:"lecture", ex:"Le texte dit que le temps qui tisse les souvenirs (croissance d'un enfant, confiance) ne s'achète pas et ne se raccourcit pas avec de l'argent."},
{q:"下線部（３）これが示していることとして正しいものはどれですか。", o:["お金が時間ほどは大切にされなくなっていったこと。","時間がお金で買えると考えられるようになったこと。","距離がお金で換算されるようになってしまったこと。","時間が距離を表す単位ではなくなってしまったこと。"], a:1, t:"référence", ex:"これ renvoie au paragraphe précédent : « le temps s'achète avec de l'argent ». Astuce : これ / それ renvoient presque toujours à l'idée juste avant."},
{q:"下線部（４）野生のゴリラについて述べた文章として正しいものはどれですか。", o:["野生のゴリラが共鳴集団をつくる上で最も重要なのは、言葉の力である。","野生のゴリラが人間と生活することは、不可能であると考えられている。","野生のゴリラの生活を知ることは、サッカーやラグビーにも有益である。","野生のゴリラはお互いの気持ちを理解しながら、組織的に生活している。"], a:3, t:"lecture", ex:"Les gorilles lisent les émotions et intentions des autres par les gestes et les expressions, en groupes soudés d'une dizaine. A est faux : les gorilles n'ont pas de langage."},
{q:"下線部（５）について、筆者がそのように考える理由として正しいものはどれですか。", o:["インターネットやメールを使った交信では、情報量が膨大になりすぎて、コミュニケーションの時間が足りなくなってしまうから。","現代社会では、人々が情報化に慣れておらず、人間関係を効率的に結ぶことよりも、実際に会うことが求められることが多いから。","人々と信頼できる関係を築くためには、時間を惜しむのではなく、一緒に見たり、触れたり、話したりすることが必要になるから。","フェイスブックやチャットで交信するときに用いる言葉は、身体化されたコミュニケーションを補助する役割しか果たさないから。"], a:2, t:"lecture", ex:"Pour l'auteur, la confiance naît du face-à-face (vue, contact, parole) et du temps passé ensemble, ce que les échanges écrits ne remplacent pas."}
]}

{id:"V", title:"Compréhension d'un texte long", instr:"次{つぎ}の文章{ぶんしょう}を読{よ}んで、あとの問{と}いに答{こた}えなさい。", pts:6,
passage:"今、私たちは手軽に食べるモノを手に入れられる社会に生きています。近所のスーパーやコンビニに行けば、いつでもいろんな食品を買うことができます。スーパーには、同じサイズ、同じ形で傷のない野菜がいつでも並んでいます。ファストフード店では、手軽に安くてそれなりにおいしい食事ができます。\n（１）[[このような生活]]を「当たり前」のように思っていますが、本当に「当たり前」なのでしょうか？\nみなさんは、近年、頻発している台風や地震などの災害で停電を経験したことはありますか？ スマホで友達とコミュニケーションをし、ネットで情報を集めるのが「当たり前」だったのに、電気が止まるとそれらが一瞬にしてできなくなってしまいます。電気が止まると、冷蔵庫や電子レンジなどの家電製品も使えなくなります。道路が遮断されて物流が止まると、スーパーやコンビニの棚がすぐ空っぽになったことを、体験したり、ニュースで見たりしたこともあるでしょう。\n（２）[[みなさんの口まで食料を届ける現在のシステム]]は、その生産や加工や流通に安い労働力を使いつつ、冷蔵・冷房や輸送に膨大なエネルギーと資源を使いつつ、経済的効率性を最優先して、地球の裏側からみなさんの食卓までグローバルなサプライチェーンを築いてきました。だからこそ、「当たり前」のように私たちがいつでもどこでもすぐ食べるモノを買うことができたのです。\nでも、この経済的効率性を最優先したシステムは、脆いものです。そのどこかでトラブルがあったら、瞬く間に、私たちは食べるモノを手に入れる手段を失ってしまうのです。（中略）\nそれでは、そのような社会に生きる私たち一人ひとりは、これからどうすればいいのでしょうか？\nはじめの一歩として、（３）[[身の回りの生活を見直して、お金の世界から離れてみる]]ことから始められるのではないかと思います。\n最近話題になった、斎藤幸平さんという経済思想家の『人新世の「資本論」』という本があります。この中で斎藤さんは、商品としての「価値」ではなく、「使用価値」（有用性）を重視する社会に移行すべきだと提案しています。売って儲ける「商品」としてお金で計られる価値より、自分と人の役に立つ、地域や環境にも貢献する有用性を重視する。つまり「使用価値」を重視することから変わり始められるとのこと。\n私なりに食べもので紹介してみましょう。例えば、（４）[[ペットボトルのお茶を買ってくる代わりに、自分でお茶を淹れてみたらどうでしょうか]]。お茶っ葉はたぶん買ってくるので商品経済から完全には抜け出せませんが、何%かは切り離せるでしょう。そうすれば、自分がお茶をおいしく飲んでほっこりするし、次はもっとおいしいお茶を飲みたいと思って、お茶の淹れ方を調べたり工夫したりするようになるかも。\nおいしいお茶を淹れられるようになったら、家族や友だちに飲んでもらいたくなるかもしれません。自分や親しい人が飲む茶葉に使われる農薬が気になったり、それを無農薬で育てようと努力してくれている農家さんに関心が向いたり、水道の水を確保してくれている市町村の水道局の人たちを応援したりしたくなるかもしれません。\nおいしいお茶を淹れられる知識やスキル、それによって広げられる人間関係は、お金では計れない富となるでしょう。\nお茶の次には、料理に挑戦してみてください。これからは老若男女とも、自分の身体と頭脳をつくる食べものを選び取ること、自分で食事を用意できるスキルをもつことは、自己防衛のためにも環境負荷を減らすためにも必要になってきます。そうすれば、人も自然も壊さない食と農を考え始められるでしょう。\n（平賀緑『食べものから学ぶ世界史』より、一部表記を改めた）",
items:[

{q:"下線部（４）について、自分でお茶を淹れることの効果について、筆者の考えと合わないものはどれですか。", o:["お茶の淹れ方に興味を持って、もっとおいしいお茶が淹れられるように工夫するようになる。","お茶の葉の農薬やお茶を作っている農家さんのことなどについて知りたいと思うようになる。","おいしいお茶の淹れ方がわかるようになり、知識も人間関係も豊かになる。","商品経済についてよくわかり、お茶の商品価値について考えるようになる。"], a:3, t:"lecture", ex:"Question piège « 合わないもの » (ce qui NE correspond PAS). L'auteur parle de valeur d'usage, pas de valeur marchande."},
{q:"本文と内容が合っているものはどれですか。", o:["いつでもどこでも手軽に食べものを買えるように、災害があっても流通が止まらないような強いシステムを作った方がいい。","経済的効率性ばかり考えるシステムは問題があり、人にも自然にもやさしい生活について一人ひとりが考えた方がいい。","経済思想家の斎藤幸平さんは、モノの使用価値を重視する社会にできるよう、お茶を自分で淹れたり、料理をしたりすることを勧めている。","スーパーやコンビニで同じサイズ、同じ形で傷のない野菜があることは当たり前のことで、これは地域や環境にも役に立っている。"], a:1, t:"idée principale", ex:"Thèse globale du texte. C est un piège : l'exemple du thé est celui de l'auteure, pas de Saito."}

{id:"V", title:"Compréhension d'un texte long", instr:"次{つぎ}の文章{ぶんしょう}を読{よ}んで、あとの問{と}いに答{こた}えなさい。", pts:6,
passage:"効率よく技術を獲得するために個人ができることとしては、「良き師匠や先輩を持つ」というのもあります。これは一般の技術の伝達の現場では、あまり意識されていないようです。しかし、たとえば伝統技術の現場では、どんな師匠や先輩につくかで、獲得できる技術のレベルが決まってしまうほど重要なものです。\n技術を獲得するとき、まず（１）[[全体像を見ておく]]とその後の知識の吸収が楽になります。とはいえ、まったく知識のない人がはじめて見る技術の全体像をつかむのはたいへんなことです。これを初心者が独力で行うことなどほとんど不可能でしょうが、師匠や先輩の手助けを受けることができれば、初心者でも全体像を見る体験をすることは可能です。\nこういうとき、離れた場所で注意深く見守っていながらも本人の自由にやらせてくれるのが良き師匠や先輩の特徴です。好き勝手にやらせているように見えて、致命的な失敗を起こさないようにしっかりとみているのです。一方、ダメな師匠や先輩は自分の考えややり方を直接的に後輩に伝えようとして最初から後輩の行動をやたらと制約しようとします。そのため後輩は経験できることが少なくなり、獲得できる技術の幅も狭くなります。（中略）\n師匠や先輩に教えを請うというと、多くの人は手取り足取り教わる姿を想像するかもしれません。しかし、わからないことをなんでもかんでも先輩に質問し、その都度答えを得るというのは最も低レベルのやり取りであまり感心できません。これは初心者のうちこそ許されますが、そのような聞き方を続けていると自分のレベルも上がらないですし、やがては誰からも相手にされなくなってしまうでしょう。\n（２）[[教えを請うときのやり方には、レベルによって三段階がある]]ように思います。第一段階は、いま紹介した、先輩が目の前にいてわからないことを直接聞くレベルです。まだ技術のなんたるかもわからない初心者レベルでは、このようなやり取りをするしかありません。ただし、このような方法で教えを請うときには、きちんと見守ってくれる先輩が必ず必要になります。\n第二段階は、基本的に自分で問題を解決し、本当にわからないことについてだけ先輩に聞くレベルです。これには、先輩に疑問をぶつけることを仮定して自分で考え、先輩からどのような答えが返ってくるかを自分で想像しながら答えを見つけるというやり方も含まれます。\nこの方法は、なるべく自分で考えながら答えを見つけるのが特徴です。（中略）こうしたやり方をすると、目的意識を持って自分で行動しながら技術を獲得することになるので、高いレベルの技術を正確かつ早く習得できるようになります。\nなお、自分で動いて答えを見つけるというのが基本だとすると、一見すると先輩はいらないように思えます。しかし、自分が出した答えが正しいかどうかの判断は自分自身ではできません。そこで自分の答えを確認するために、先輩の手助けを借りることになるのです。\n第三段階は、優れた先輩に思いを馳せ、想像の世界の中でその人と対話をしながら技術を獲得するレベルです。これは最も高いレベルの技術の伝達法で、この場合は必ずしも生きている先輩がいる必要はありません。\n現実には、（３）[[このようなシチュエーション]]はあまりないように思われるかもしれません。しかし、伝統技術を扱う現場では、長い間技術を守ってきた人が後輩にすべての技術を伝授する前にこの世を去るということはよくあります。しかも、一般の製造業の現場とちがって、彼らは技術に関する知識をマニュアルなどの文章にして残したりしていません。こうなると、熟練した技術者がいなくなるとともに技術そのものが消えることになりかねません。\nそれでいて実際には後世にきちんと技術が伝わっているのは、想像の世界の先達と対話をしながら答えを見つけることのできる優れた後継者がいるからなのです。ちなみに、（４）[[このように伝達された技術]]は、過去のものと同じように見えて実際はまったくちがいます。それは伝えられたというより、優れた後継者の手によって再びつくり上げられたといったほうがいいでしょう。しかも、自分で考えながら答えを出してきているので、時代の移り変わりによって生じた条件の変化にも応えられるものになっています。だから、技術の中身は過去のものよりもはるかにしっかりしたものになっています。\n技術を伝えるというのは、このようなことではないかと私は考えています。表面的な知識さえ伝わればそれでいいというものではないのです。\n（畑村洋太郎『組織を強くする技術の伝え方』より、一部表記を改めた）",
items:[
{q:"下線部（１）全体像を見ておくことについて、本文の内容に合っているものはどれですか。", o:["初心者が一人でするのは難しいが、師匠や先輩の助けがあれば全体像は見られる。","初心者がどのように工夫しても全体像を絶対に見ることはできない。","師匠や先輩が初心者のそばで指示を出し続けることで、初心者は全体像を見られる。","技術を獲得する前に全体像を見ておけば、師匠や先輩の教えは必要ない。"], a:0, t:"lecture", ex:"Impossible seul, mais possible avec l'aide d'un mentor. C est faux : le bon mentor observe de loin."},
{q:"下線部（２）について、本文の内容に合わないものはどれですか。", o:["第一段階では、見守ってくれる先輩が必要だ。","第一段階では、直接、先輩にわからないことを質問する。","第二段階では、自分で答えを見つけるので先輩は必要ない。","第三段階では、頭の中で先輩と対話をしながら技術を身につける。"], a:2, t:"lecture", ex:"Question « 合わないもの ». Au 2e niveau, on a encore besoin du senior pour vérifier ses réponses."},
{q:"下線部（３）このようなシチュエーションとは、どのようなシチュエーションを指していますか。", o:["技術に関する知識がマニュアルとして残してある状況。","技術を教えてくれる先輩が亡くなってしまっている状況。","高い技術を持った人が後輩に丁寧に技術を伝える状況。","高い技術が後輩に伝わって、技術が受け継がれる状況。"], a:1, t:"référence", ex:"La situation du 3e niveau : le maître n'est plus en vie, on dialogue avec lui en imagination."},
{q:"下線部（４）このように伝達された技術について、本文の内容に合っているものはどれですか。", o:["後輩の技術よりも先輩の技術の方が、しっかりとしたものだった。","先輩の持っていた技術が、そっくりそのまま後輩に伝えられている。","先輩の技術よりも後輩の技術の方が、時代の変化に応じたものになっている。","先輩の持っていた技術とは関係がなく、後輩が自分で考えて作った技術である。"], a:2, t:"lecture", ex:"La technique recréée répond aux changements de l'époque. D est trop fort : elle vient bien du maître."},
{q:"本文の内容に合っているものはどれですか。", o:["技術を獲得するためには、段階に応じて先輩への質問の仕方を変えたり、自分で考えたりすることが重要だ。","技術は後継者が自分で考えて新たに作り上げるものなので、表面的な技術が伝わればそれで十分だ。","いい師匠や先輩がいなければ技術の伝達は全くできないので、技術を伝えるためにはいい指導者の育成が必要だ。","効率よく技術伝達を行うために、いい師匠や先輩を持つ必要があることは、昔から強く意識されてきた。"], a:0, t:"idée principale", ex:"Synthèse des trois niveaux. B contredit la fin (« pas seulement le savoir superficiel »), D contredit le début."}
]}
]});

{id:"III", title:"Error detection", instr:"One of the underlined parts is grammatically incorrect. Choose the incorrect part.", pts:2, err:true, items:[
{q:"(A) With soaring limestone islands, white sandy bays and colorful shacks, (B) Thailand is one of the world's quintessential paradise destination. (C) It's the stuff of vacation fantasy. (D) But while few places are better for a sun-drenched break, there's so much more to this country than kicking back with a cocktail.", a:1, fix:"one of the world's quintessential paradise destination → … destinations", t:"accord", ex:"One of the + nom PLURIEL : one of the… destinations."},
{q:"(A) Nothing about RRR is small: the size of the crowd scenes, the scale of the battles, the sadistic villainy of the British, the three-hour running time. (B) It was the most expensive Indian movie ever made (an estimated $72m) and it shows. (C) The story is set in the 1920s, during the British Raj, and parallels the journeys of two men who is opposed politically, (D) yet similar in their unbreakable determination and superheroic athleticism.", a:2, fix:"two men who is → two men who are", t:"accord", ex:"Le relatif who renvoie à two men (pluriel) : who are."},
{q:"(A) I can kill foxes but I can't kill wolves. (B) Not in real life, obviously – in real life I send emails eight hours a day – but in The Legend of Zelda: Tears of the Kingdom, where every animal is an arrow away from becoming a fortifying meal. (C) Shoot a wolf and you'll reward with a thick red slab of raw prime meat, (D) but I can't do it, I just can't do it, even though they often attack me in packs.", a:2, fix:"you'll reward with → you'll be rewarded with", t:"voix passive", ex:"C'est toi qui reçois la récompense : passif, be rewarded with."},
{q:"(A) The report said the climate crisis exacerbated existing inequalities. (B) In east and southern Africa, for example, tropical cyclones have damaged health facilities, disrupting access to maternal health services and helping spread waterborne diseases such as cholera. (C) Hurricanes and droughts increase the risks of gender-based violence and child marriage, it added, (D) as families under stress are less able to support daughters and seek to marry with them off.", a:3, fix:"marry with them off → marry them off", t:"phrasal verbs", ex:"To marry someone off = marier quelqu'un (le faire épouser). Pas de « with »."},
{q:"(A) More than a dozen heads of state of African countries are due to attend the first African Climate Summit (B) as the continent seeks to assert a stronger voice on a global existential problem those it contributes the least to. (C) Kenyan President William Ruto's government and the African Union launched the meeting on Monday in Nairobi, (D) determined to wield more global influence and bring in far more financing and support.", a:1, fix:"those → that", t:"pronoms relatifs", ex:"Relatif après « problem » : that (ou which). « Those » n'est pas un relatif."},
{q:"(A) The cards were part of a collaboration between the museum and Pokémon Company International (B) to celebrate the museum's 50th anniversary and recognize the link between van Gogh and Japanese art and culture. (C) The museum also displayed paintings of Pokémon, including Pikachu and Snorlax, (D) which was dispersed among van Gogh's self portraits and famous sunflowers.", a:3, fix:"which was → which were", t:"accord", ex:"Which renvoie à paintings (pluriel) : which were."},
{q:"(A) Teachers and school administrators still struggle with separate the more authentic wheat from the automated chaff. (B) Some institutions are investing in AI detection tools, but these are proving spotty at best. (C) In recent tests, popular AI text detectors wrongly flagged articles by non-native English speakers, and some suggested that AI wrote the US constitution. (D) In July OpenAI quietly pulled AI Classifier, its experimental AI detection tool, citing \"its low rate of accuracy\".", a:0, fix:"struggle with separate → struggle to separate", t:"infinitif / gérondif", ex:"Struggle TO do (ou struggle with doing). « With separate » est impossible."},
{q:"(A) Many animals in circuses are kept in environments that are considered too small and unable to meet their needs. (B) They spend a lot of they're time confined to \"beast wagons\" or chained up in trucks. (C) A 2006 report on animal welfare in circuses in England and Wales found that accommodation provided for the animals was variable in quality, with little thought given to enrichment and species-specific needs. (D) Circuses have been exposed for using cruel methods to train and subdue animals.", a:1, fix:"they're → their", t:"homophones", ex:"Their (possessif) ≠ they're (they are) ≠ there. Piège classique, revient chaque année."},
{q:"(A) Overpopulation of livestock and the effects of climate change mean grass on the steppe, which animals eat to survive, is becoming thinner year to year. (B) The nomads who have herded animals on horseback for centuries are finding it harder to keep their animals, the main source of their livelihoods, fed properly. (C) With their livelihoods at risk, some are being forced to the capital, into Ulaanbaatar's \"Ger districts\". (D) Approximately 60 percent of Ulaanbaatar's population is crowded into these areas.", a:0, fix:"year to year → year on year", t:"expressions", ex:"Year on year = d'année en année (évolution). Le corrigé officiel retient cette expression."},
{q:"(A) One of Singapore's most-loved institutions has been given a timely boost, with the country's hawker culture being added to the UNESCO list of Intangible Cultural Heritage of Humanity. (B) The award took place at a virtual ceremony on 16 December and it sees the culture join the likes of yoga in India and the tango in Argentina. (C) Hawker culture refers to the community of vendors who cook and sell meals in the 114 hawker centres across the city-state. (D) The verdict could not have come at a better time for the vendors, provided invaluable protection after a precarious year.", a:3, fix:"provided → providing", t:"participes", ex:"Participe présent pour une conséquence : …, providing invaluable protection."}
]},
{id:"IV", title:"Cloze passage", instr:"Choose the most suitable word or string of words to fill each numbered blank.", pts:2, cloze:true,
passage:"It's a point in 2022's favour that, rather than violent insurrection or the misery of lockdown, most English-speaking people (1) the internet are currently preoccupied with a harmless word game. Harmless at the time of writing, I should say – it's (2) that some kind of backlash is inevitable. I'm sure any day now Wordle will be revealed as a Bad Thing and I don't want to speculate how; I am merely here to observe that it is a) a lot of fun b) (3) interesting, and I'd like to explain why. I (4) even be able to make you a bit better at it.\nIf you don't already know, Wordle is a browser-based puzzle that gives you six goes at guessing a five-letter word. If your guess includes a letter that's correct but in the wrong place, it turns yellow. If it includes a letter that's correct and in the right place, it turns green, allowing you to build on your guesses (5) you hit the jackpot. It's helpful to understand what Wordle is mainly testing, and I think there are a couple of things: first, your knowledge of the (6) of individual letters in the English language – that is, how common they are. So it would be unwise, for example, to use \"hyrax\" as your first guess. More interestingly, though, it probes your (7) for how letters can be combined.\nOK, so (8) will have a sense of how to answer these questions already, (9) we use words every day and have a gut feeling for which sequences are possible where, and which aren't allowed at all (\"ng\", for example, is pretty common in English, but never at the beginning of a word, and \"lng\" never appears (10)).",
items:[
{q:"(1)", o:["for","in","to","at"], a:2, t:"prépositions", ex:"People TO the internet… Le corrigé retient « to ». Retiens : people (connected) to the internet."},
{q:"(2)", o:["polite enough","enough popular","enough polite","popular enough"], a:3, t:"structures", ex:"Adjectif + enough : popular enough (assez populaire pour qu'un retour de bâton soit inévitable)."},
{q:"(3)", o:["linguistic","linguistically","linguistics","linguist"], a:1, t:"formation des mots", ex:"Un adverbe modifie l'adjectif interesting : linguistically interesting."},
{q:"(4)", o:["may","need","must","shall"], a:0, t:"modaux", ex:"May = possibilité (je pourrais même vous rendre meilleur)."},
{q:"(5)", o:["until","while","when","after"], a:0, t:"connecteurs", ex:"Until = jusqu'à ce que tu trouves le bon mot."},
{q:"(6)", o:["fluency","accuracy","frequency","adequacy"], a:2, t:"vocabulaire académique", ex:"Frequency = fréquence, expliqué juste après : how common they are."},
{q:"(7)", o:["precinct","extinct","distinct","instinct"], a:3, t:"vocabulaire", ex:"Instinct for = intuition de. Faux amis visuels : distinct, extinct, precinct."},
{q:"(8)", o:["most us","most of us","we most","most we"], a:1, t:"quantifieurs", ex:"Most of + pronom : most of us."},
{q:"(9)", o:["although","because of","because","in spite of"], a:2, t:"connecteurs", ex:"Because + proposition (we use words…). Because of + nom seulement."},
{q:"(10)", o:["somewhere","anywhere","everywhere","elsewhere"], a:1, t:"quantifieurs", ex:"Never… anywhere : « lng » n'apparaît nulle part (négation + any)."}
]},
{id:"V1", title:"Reading — Part I", instr:"Read the passage and select the best answer to each question.", pts:2,
passage:"\"The sounds uttered by birds offer in several respects the nearest analogy to language,\" Charles Darwin wrote in \"The Descent of Man\" (1871), while contemplating how humans learned to speak. Language, he speculated, might have had its origins in singing, which \"might have given rise to words expressive of various complex emotions.\"\nNow researchers from MIT, along with a scholar from the University of Tokyo, say that Darwin was on the right path. The balance of evidence, they believe, suggests that human language is a grafting of two communication forms found elsewhere in the animal kingdom: first, the elaborate songs of birds, and second, the more utilitarian, information-bearing types of expression seen in a diversity of other animals.\n\"It's this adventitious combination that triggered human language,\" says Shigeru Miyagawa, a professor of linguistics in MIT's Department of Linguistics and Philosophy, and co-author of a new paper published in the journal Frontiers in Psychology.\nThe idea builds upon Miyagawa's conclusion, detailed in his previous work, that there are two \"layers\" in all human languages: an \"expression\" layer, which involves the changeable organization of sentences, and a \"lexical\" layer, which relates to the core content of a sentence. His conclusion is based on earlier work by linguists including Noam Chomsky, Kenneth Hale and Samuel Jay Keyser. Based on an analysis of animal communication, and using Miyagawa's framework, the authors say that birdsong closely resembles the expression layer of human sentences — whereas the communicative waggles of bees, or the short, audible messages of primates, are more like the lexical layer. At some point, between 50,000 and 80,000 years ago, humans may have merged these two types of expression into a uniquely sophisticated form of language.\n\"There were these two pre-existing systems,\" Miyagawa says, \"like apples and oranges that just happened to be put together.\"\nThese kinds of adaptations of existing structures are common in natural history, notes Robert Berwick, a co-author of the paper, who is a professor of computational linguistics at MIT.\n\"When something new evolves, it is often built out of old parts,\" Berwick says. \"We see this over and over again in evolution. Old structures can change just a little bit, and acquire radically new functions.\"\nTo consider the difference between the expression layer and the lexical layer, take a simple sentence: \"Todd saw a condor.\" We can easily create variations of this, such as, \"When did Todd see a condor?\" This rearranging of elements takes place in the expression layer and allows us to add complexity and ask questions. But the lexical layer remains the same, since it involves the same core elements: the subject, \"Todd,\" the verb, \"to see,\" and the object, \"condor.\"\nBirdsong lacks a lexical structure. Instead, birds sing learned melodies with what Berwick calls a \"holistic\" structure; the entire song has one meaning, whether about mating, territory or other things. The Bengalese finch can loop back to parts of previous melodies, allowing for greater variation; a nightingale may be able to recite from 100 to 200 different melodies.\nHumans, according to Miyagawa, Berwick and Okanoya, fruitfully combined these systems. We can communicate essential information, like bees or primates — but like birds, we also have a melodic capacity and an ability to recombine parts of our uttered language. For this reason, our finite vocabularies can generate a seemingly infinite string of words. Indeed, the researchers suggest that humans first had the ability to sing, as Darwin conjectured, and then managed to integrate specific lexical elements into those songs.\n\"It's not a very long step to say that what got joined together was the ability to construct these complex patterns, like a song, but with words,\" Berwick says.\nAs they note in the paper, some of the \"striking parallels\" between language acquisition in birds and humans include the phase of life when each is best at picking up languages, and the part of the brain used for language. Another similarity relates to an insight of MIT professor emeritus Morris Halle, who observed that \"all human languages have a finite number of stress patterns, a certain number of beat patterns. Well, in birdsong, there is also this limited number of beat patterns.\"",
items:[
{q:"What do researchers from MIT and the University of Tokyo believe about the origins of human language?", o:["Birdsong developed straight into human language.","Human language evolved solely from the utilitarian expressions seen in animals.","Human language evolved from integrating lexical elements into melodies.","Human language development was triggered by the complex emotions expressed by birds."], a:2, t:"idée principale", ex:"Paragraphe « Humans first had the ability to sing… then integrate specific lexical elements into those songs ». A et B sont trop absolus (straight, solely)."},
{q:"According to the passage, what was combined adventitiously?", o:["Communicative waggles of bees and audible messages.","Animal communication and human language.","The elaborate songs of birds and information-bearing types of expression seen in a diversity of other animals.","Apples and oranges."], a:2, t:"détail", ex:"Le 2e paragraphe décrit les deux formes combinées. D est une métaphore, pas la réponse littérale."},
{q:"What is the \"expression layer\" of human language?", o:["The layer consisting of fixed sentence structures.","The layer that adds complexity by restructuring the elements in the sentence.","The layer consisting of basic vocabulary and words.","The layer that adds complexity by including non-verbal communication cues."], a:1, t:"définition", ex:"Exemple Todd/condor : réarranger les éléments se passe dans l'expression layer et ajoute de la complexité."},
{q:"What does Robert Berwick emphasize about evolution of new structures in natural history?", o:["New structures normally emerge from new functions.","Evolutionary changes rarely involve old parts.","Old structures are radically different from new structures.","Small changes in old structures can lead to new functions."], a:3, t:"paraphrase", ex:"« Old structures can change just a little bit, and acquire radically new functions »."},
{q:"Who wrote the new paper published in Frontiers in Psychology together with Shigeru Miyagawa?", o:["Charles Darwin.","Noam Chomsky, Kenneth Hale and Samuel Jay Keyser.","Robert Berwick and Okanoya.","Morris Halle."], a:2, t:"détail", ex:"Berwick est « co-author of the paper » et le texte cite « Miyagawa, Berwick and Okanoya ». Chomsky = travaux antérieurs."}
]},
{id:"V2", title:"Reading — Part II", instr:"Read the passage and select the best answer to each question.", pts:2,
passage:"University students are more at risk of depression and anxiety than their peers who go straight into work, according to a study, suggesting mental health may deteriorate due to the financial strain of higher education.\nThe research is the first to find evidence of slightly higher levels of depression and anxiety among students, and challenges earlier work suggesting that the mental health of students is the same as or better than their peers.\nThe first author of the study, Dr Tayla McCloud, a researcher in the psychiatry department at University College London (UCL), said the fact that the link between university and poor mental health had not been established in earlier studies could mean that it is due to \"increased financial pressures and worries about achieving high results in the wider economic and social context\".\nAs well as grappling with rising costs due to inflation, university students this year are facing unprecedented rent rises averaging at 8% and far outstripping the average maintenance loan in many cities.\nMcCloud said she would have ordinarily expected university students to have better mental health as they tend to be from more privileged backgrounds, making the results \"particularly concerning\" and requiring more research to pinpoint the risks facing students.\nThe lead author, Dr Gemma Lewis, associate professor at UCL's school of psychiatry, said poorer mental health at university could have repercussions in later life.\nThe research paper, published in the Lancet Public Health and commissioned by the Department for Education, states that by the age of 25 the difference in mental health had disappeared between graduates and non-graduates.\nThe analysis suggested that if the potential mental health risks of attending higher education were eliminated, the incidence of depression and anxiety could be reduced by 6% among people aged 18-19.\nThe researchers used data from the Longitudinal Studies of Young People in England, which includes 4,832 young people born in 1989-90 and 6,128 participants born in 1998-99. In both studies, just over half attended higher education.\nThe researchers found a small difference in symptoms of depression and anxiety at age 18-19 between students and non-students, even controlling for factors including socioeconomic status, parents' education and alcohol use.\nTheir findings were echoed in research from King's College London that found reported mental health problems among university students had almost tripled between 2016-17 and 2022-23, rising from 6% to 16%.\nA significant part of this increase occurred in the last 12 months, coinciding with the cost of living crisis.\nThe research found that among students considering dropping out of university, the proportion citing financial distress rose from 3.5% to 8% between 2022 and 2023.\nThe research also found a small gradual increase in the rate of mental health difficulties as students undertook more paid work during term time.",
items:[
{q:"Based on the text, which statement is TRUE?", o:["University students have lower levels of depression and anxiety due to their academic engagement.","University students are more likely to experience depression and anxiety, due to financial stress and academic pressure.","University students and working peers have similar mental health levels.","University students face fewer mental health problems as they know how to handle stress."], a:1, t:"idée principale", ex:"1er et 3e paragraphes : plus de risques, liés aux pressions financières et aux résultats."},
{q:"Which of the following financial challenges is NOT MENTIONED in the text?", o:["Rising costs due to inflation.","Unexpected rent increase in many cities.","Increased tuition fees at many universities.","Insufficient maintenance loans."], a:2, t:"NOT mentioned", ex:"Les frais de scolarité ne sont jamais cités. Méthode : vérifier chaque option dans le texte."},
{q:"Based on the text, which of the following is TRUE?", o:["The mental health difference between graduates and non-graduates stays significant after the age of 25.","No research so far has proven any difference in the mental situation of graduates and non-graduates.","The mental health difference between graduates and non-graduates increases with age.","The mental health difference between graduates and non-graduates is neutralized by the age of 25."], a:3, t:"paraphrase", ex:"« By the age of 25 the difference… had disappeared » = neutralized."},
{q:"What is TRUE about reported mental health problems among university students according to King's College London?", o:["It has stayed the same.","It has risen from 3.5% to 8%.","It has almost tripled.","It has dropped from 16% to 6%."], a:2, t:"chiffres", ex:"Almost tripled (6% → 16%). Piège : 3,5% → 8% concerne l'abandon des études."},
{q:"Which of the following things is NOT mentioned in the text?", o:["The rising cost of living and its effect on university students' mental health.","A comparison of the risk of experiencing mental health problems between graduates and non-graduates.","The relation between students' mental health and the rate of dropping out.","The relation between university students' part-time work and mental health difficulties."], a:2, t:"NOT mentioned", ex:"Le texte parle des raisons financières d'abandon, pas du lien santé mentale ↔ taux d'abandon."}
]}
]});

EXAMS.push({
id:"en2024", subject:"en", year:2024, title:"English (A) 2024", minutes:60,
sections:[
{id:"I", title:"Vocabulary in context", instr:"Choose the word or phrase that best completes each sentence.", pts:2, items:[
{q:"(＿＿) the progress scientists have made to understand sunbathing animals, there's still a lot to untangle.", o:["Despite","Unless","Rather than","Because of"], a:0, t:"connecteurs", ex:"Despite + nom = malgré. Opposition : malgré les progrès, il reste beaucoup à démêler."},
{q:"Ashurbanipal was proud of his (＿＿) to read and write, and portrayed himself bearing both weapons and a stylus.", o:["powerfulness","possibility","potential","ability"], a:3, t:"collocations", ex:"Ability TO do = capacité à faire. Possibility se construit avec « of »."},
{q:"We'd be buried knee-deep in litter (＿＿) we didn't have soil microorganisms.", o:["since","if","because","when"], a:1, t:"conditionnel", ex:"Conditionnel irréel : would + base verbale… if + prétérit."},
{q:"Any child can be spoiled whether they are (＿＿) or not.", o:["an alone child","a lonesome child","an only child","a solo child"], a:2, t:"vocabulaire", ex:"An only child = enfant unique. Expression figée."},
{q:"At the start of the 20th century, more than 100,000 tigers roamed the planet, but loss of habitat (＿＿) more than 90 percent of their range, according to Panthera.", o:["perished","cleaned up","faded away","wiped out"], a:3, t:"phrasal verbs", ex:"Wipe out = anéantir (transitif, avec un complément). Perish et fade away sont intransitifs."},
{q:"The earthquake—and fears of another one like it—are the constant (＿＿) of conversation in the city.", o:["concept","question","topic","message"], a:2, t:"collocations", ex:"Topic of conversation = sujet de conversation."},
{q:"On Friday, due to a combination of daily traffic and weekend travellers, (＿＿) traffic is expected from early morning until late evening.", o:["rich","big","heavy","strong"], a:2, t:"collocations", ex:"Heavy traffic = circulation dense. Collocation très fréquente (aussi heavy rain)."},
{q:"The unearthing of King Tut's lost tomb is (＿＿) one of the greatest—if not the greatest—archaeological discoveries in history.", o:["questionably","doubtfully","arguably","faithfully"], a:2, t:"adverbes", ex:"Arguably = sans doute, on peut soutenir que. Très utilisé en anglais académique."},
{q:"I think we should (＿＿) it a day and go home.", o:["claim","say","name","call"], a:3, t:"idiomes", ex:"Call it a day = s'arrêter pour aujourd'hui."},
{q:"Will self-driving cars on our roads ever be a (＿＿)?", o:["truthfulness","fiction","reality","fantasy"], a:2, t:"collocations", ex:"Become / be a reality = devenir réalité."}
]},
{id:"II", title:"Grammar in context", instr:"Choose the word or phrase that best completes each sentence.", pts:2, items:[
{q:"My father wanted (＿＿) a teacher like himself.", o:["that I be","me to be","that I am","me to am"], a:1, t:"infinitif / gérondif", ex:"Want + objet + to + verbe : wanted me to be."},
{q:"All applications are due (＿＿) October 17, 2022.", o:["up to","until","by","at"], a:2, t:"prépositions", ex:"By = au plus tard (date limite). Until = jusqu'à (durée continue)."},
{q:"The key to choosing good conversation topics for teens is to stop and consider (＿＿).", o:["they're interested in really what","they're really interested in what","what they're really interested in","they're interested in what really"], a:2, t:"ordre des mots", ex:"Question indirecte : what + sujet + verbe (pas d'inversion), préposition à la fin."},
{q:"She (＿＿) that the contents of the box were a collection of letters.", o:["said me","told me","told to me","to me said"], a:1, t:"say / tell", ex:"Tell + personne (told me). Say + to + personne, jamais « said me »."},
{q:"I've been here (＿＿) seven months.", o:["on","for","between","since"], a:1, t:"temps verbaux", ex:"For + durée, since + point de départ, avec le present perfect."},
{q:"Can you give me (＿＿) information on what to expect when I come to campus?", o:["a few","an","a","some"], a:3, t:"indénombrables", ex:"Information est indénombrable : some information, jamais « an information »."},
{q:"Education today is (＿＿) than ever.", o:["expensiver","more expensive","too expensive","expensive"], a:1, t:"comparatifs", ex:"Adjectif long : more + adjectif + than."},
{q:"She (＿＿) down in bed and read a book.", o:["laid","lie","lied","lay"], a:3, t:"verbes irréguliers", ex:"Lie (s'allonger) – lay – lain. Lay (poser) – laid – laid. Lie (mentir) – lied."},
{q:"Viking women were power knitters (＿＿) textiles provided vital trade across Europe, researchers say.", o:["whose","who","which","whom"], a:0, t:"pronoms relatifs", ex:"Whose = dont (possession) : les textiles DES femmes."},
{q:"The research (＿＿) in a paper that will be published by the journal Astronomy & Astrophysics and is already available to read online.", o:["describes","is described","will describe","has described"], a:1, t:"voix passive", ex:"La recherche EST décrite dans un article : passif."}
]},
{id:"III", title:"Error detection", instr:"One of the underlined parts is grammatically incorrect. Choose the incorrect part.", pts:2, err:true, items:[
{q:"(A) Ohio State women's hockey head coach Nadine Muzerall has welcomed familiar faces to the Buckeye bench ahead of the 2022-23 season with the promotion of Kelsey Cline to assistant coach and the hiring of Lauren Spring as director of operations. (B) \"It is a privilege to be afforded this opportunity and see it come full circle,\" Spring said. (C) \"First as a student-athlete and now a staff with the ability to contribute back to a program that offered me countless positive experiences which have allowed me to get to where I am today. (D) It is a true testament to Coach Muzerall and the positive impacts she has on her players…\"", a:2, fix:"a staff → a staff member", t:"noms collectifs", ex:"Staff désigne le personnel (collectif). Une personne = a staff member."},
{q:"(A) Employers ask \"Tell me about a time you did a mistake\" to see how you handle challenging situations. (B) Admitting your mistakes shows a sense of integrity and also indicates that you understand that you might have some failures throughout your career. (C) The key to answering this interview question is showing employers that you learned from your mistake. (D) This common interview question shows employers your potential weaknesses and how you might overcome them.", a:0, fix:"did a mistake → made a mistake", t:"make / do", ex:"MAKE a mistake (jamais do). À retenir aussi pour l'entretien !"},
{q:"(A) You may have heard something like, \"93% of communication is nonverbal!\" However, this number is wrong and outdated. (B) Famous silent characters like Charles Chaplin… can portray the entire human spectrum of emotion without having to use words at all. (C) So while there must not be a real percentage, we do know that nonverbal behaviors tell a much more comprehensive story than words do. (D) Now, most people can carefully choose their words, but they can't choose their body language.", a:2, fix:"must not → might not", t:"modaux", ex:"Must not = interdiction. Ici on exprime une possibilité : there might not be."},
{q:"(A) TikTok is serving up misinformation to users searching for news about politics, climate change, COVID-19, the war in Ukraine and more, according to a report released on Wednesday. (B) Toxicity and false claims are a \"significant threat\" at TikTok, according to a study by NewsGuard, a media watchdog. (C) NewsGuard describes itself a \"journalism and technology tool\" that rates the credibility of websites and online information. (D) \"Even when TikTok's search results yielded little to no misinformation, the results were often more polarizing than Google's,\" NewsGuard said.", a:2, fix:"describes itself a → describes itself as a", t:"prépositions", ex:"Describe X AS Y."},
{q:"(A) Yes, having a big name in science will help get your paper published, an unusually robust new study confirms. (B) Just 10% of reviewers of a test paper recommended acceptance when the sole listed author was obscure—but 59% endorsed the same manuscript when it carried the name of a Nobel laureate. (C) The study, which involved recruiting hundreds of researchers to review an economics manuscript, is \"incredible,\" says Mario Malički, a postdoctoral researcher at Stanford University. (D) \"It is the large randomized controlled trial we have seen on publication bias.\"", a:3, fix:"the large → the largest", t:"superlatifs", ex:"The + superlatif : the largest trial we have seen."},
{q:"(A) \"I was a journalist and author with a young family in London, where it is hard to make ends meet in those professions so I thought it was time for a new adventure,\" (B) Parton says over a beer in one of the apartments guests can now rent in the palace. (C) \"I decided to leave London and move to Poland where things are cheaper.\" (D) After selling his London home at first there house hunt was just for a large family home…", a:3, fix:"there → their", t:"homophones", ex:"Their house hunt (possessif). There/their/they're revient presque chaque année."},
{q:"(A) Job rotation is a strategy to move employees through different assignments in the order to expose them to various verticals in the company. (B) This is largely done as part of the company's succession plan to develop an internal pool of talents. (C) The strategy is commonly implemented in the banking industry. (D) The idea is for the employee to gain a holistic understanding of all the interconnected jobs required to provide banking services.", a:0, fix:"in the order to → in order to", t:"expressions", ex:"In order to = afin de, sans article."},
{q:"(A) A new baby island emerged in the southwest Pacific Ocean, where underwater volcanoes are plentiful. (B) One of these submerged volcanoes awoke on September 10, spewing lava, steam, and ash. (C) Just eleven hours after the volcano began to erupt, a new island had emerged above the water's surface, says NASA. (D) The newborn island grew quick in size, according to NASA.", a:3, fix:"grew quick → grew quickly", t:"adjectif / adverbe", ex:"Un verbe d'action (grew) est modifié par un adverbe : quickly."},
{q:"(A) Close to the pristine beaches of the Adriatic coast lie the ruins of the ancient Cupra temple, where a new discovery has came to light. (B) Last week, archaeologists recovered parts of the 2,000-year-old temple's frescoed walls and ceiling. (C) Finding ancient Roman temples with the interiors \"still covered in paintings\" is \"extremely rare,\" said archaeologist Marco Giglio. (D) \"It's the first time that the ruins of a shrine painted with such a wide palette of colors… has been unearthed,\" he claimed.", a:0, fix:"has came → has come", t:"verbes irréguliers", ex:"Present perfect = have + participe passé : come – came – come."},
{q:"(A) \"I dyed my hair blonde, I got blue contact lenses and I changed myself physically to fit into what was portrayed as beautiful,\" said Mutyala. (B) \"It took a lot of time to feel confident in my own skin. (C) So, now that we're finally in a place where embracing your roots and culture is considered 'cool,' it's very surreal.\" (D) And her mission is to offer customers something she never has as a teen in Texas: products that put people with deeper skin tones at the fore.", a:3, fix:"never has → never had", t:"temps verbaux", ex:"As a teen = passé terminé → prétérit : never had."}

{id:"IV", title:"Cloze passage", instr:"Choose the most suitable word or string of words to fill each numbered blank.", pts:2, cloze:true,
passage:"When robots appear to (1) people and display human-like emotions, people may perceive them as capable of \"thinking,\" or acting on their own beliefs and desires rather than their programs, according to research published by the American Psychological Association.\n\"The relationship (2) anthropomorphic shape, human-like behavior and the tendency to attribute independent thought and intentional behavior to robots is yet to be understood,\" said study author Agnieszka Wykowska. \"As artificial intelligence increasingly becomes a (3) of our lives, it is important to understand how interacting with a robot that displays human-like behaviors might induce higher likelihood of attribution of intentional agency to the robot.\"\nThe research (4) in the journal Technology, Mind, and Behavior.\nAcross three experiments involving 119 participants, researchers examined how individuals would perceive a human-like robot, the iCub, after socializing with it and watching videos together. Before and after interacting with the robot, participants (5) a questionnaire that showed them pictures of the robot in (6) situations and asked them to choose whether the robot's motivation in each situation was mechanical or intentional. (7), participants viewed three photos depicting the robot selecting a tool and then chose whether the robot \"grasped the closest object\" or \"was fascinated by tool use.\"\nIn the third experiment, the researchers programmed iCub to behave more like a machine. The cameras in the robot's eyes were deactivated so it (8) not maintain eye contact. All emotional reactions to the videos were replaced (9) a \"beep\" and repetitive movements of its torso, head and neck.\nThe researchers found that participants who watched videos with the human-like robot were more (10) to rate the robot's actions as intentional, rather than programmed, while those who only interacted with the machine-like robot were not.",
items:[

{q:"(2)", o:["around","among","across","between"], a:3, t:"prépositions", ex:"The relationship between X, Y and Z. « Between » s'emploie même avec plus de deux éléments ici."},

{q:"(7)", o:["To summarize","For example","Besides","On the other hand"], a:1, t:"connecteurs", ex:"La phrase donne un exemple précis du questionnaire : For example."},

{id:"V1", title:"Reading — Part I", instr:"Read the passage and select the best answer to each question.", pts:2,
passage:"Following a vegan diet doesn't exempt you from recycling or carrying a reusable water bottle, but it does have significant environmental benefits. In 2018, an Oxford University study declared that eating a plant-based diet is the \"single biggest way\" an individual can reduce their environmental footprint. Researchers have continued to support this claim with evidence that demonstrates the planetary harms of animal agriculture from extreme water and land usage to sweeping pollution of water, air, and soil. The logic is simple: it takes far more resources to raise an animal than it does a plant, and while animals emit harmful gases like methane into the air, plants can help neutralize these dangerous carbon gases. Plants also don't produce waste. A typical 2,000 herd of dairy cows, however, produce the same amount of waste as a city the size of Minneapolis. Of course, it's important that we still make conscious consumer choices, but just choosing a pint of non-dairy ice cream over the cow-based version inherently has its sustainability merits.\n1 Reduce greenhouse gas emissions — There is a lot that goes into raising the nearly 10 billion animals Americans eat every year—growing and transporting their feed, demolishing forests and natural areas to house them, transporting the animals and their products. All of these steps involve emissions, but perhaps the most climate-damaging aspect is the animals themselves. Living, breathing animals burp and fart; taken by the billions, these enteric emissions add up to a major environmental problem. These emissions are methane-based. Simply replacing beef consumption with plant-based fuel can drastically reduce an individual's carbon footprint from 1,984 pounds of CO2 per year to a mere 73 pounds. Yes, it's impossible not to contribute some greenhouse gasses, but that doesn't mean we shouldn't try to limit our impact.\n2 Avoid pollution — Approximately 2 billion tons of manure are produced by US livestock every year. Large-scale feedlot operations discard this waste in \"manure lagoons.\" These enormous pools of excrement are prone to leakage and have been known to contaminate the surrounding soil and groundwater. Note to self: don't purchase real estate anywhere near an animal feedlot operation.\n3 Reduce land use — Given the predicted global human population of 10 billion in 2050, we would have to procure 50-percent more land to grow all the food needed to support our consumption habits. It is physically impossible. Already, 127.4 million acres of the contiguous US land are used to grow food for livestock whereas only 77.3 million acres grow the food humans actually eat.\n4 Save water — An eight-ounce serving of cow's milk requires 120 liters of water to produce compared to just 74 liters for almond milk. Pea and oat only require 1.9 liters and 10 liters, respectively. A pound of beef takes 1,800 gallons to create, but a pound of tofu only needs 302 gallons. A single chicken egg uses 53 gallons of water while a serving of a plant-based egg only requires one gallon.",
items:[
{q:"According to the article, ＿＿", o:["you no longer have to recycle if you eat a plant-based diet.","a 2018 scientific study showed eating a plant-based diet is the single best thing you can do to fight climate change.","the planet harms animal agriculture.","extreme water and land usage are examples of pollution."], a:1, t:"paraphrase", ex:"Étude d'Oxford 2018 : « single biggest way » de réduire son empreinte. A contredit la 1re phrase. C inverse le sens."},
{q:"According to the article, ＿＿", o:["you need more resources to grow a plant than to raise an animal.","methane is a harmful gas and is emitted by animals.","neither plants nor animals produce waste.","it makes no difference for the environment whether you eat dairy or plant-based ice cream."], a:1, t:"détail", ex:"« Animals emit harmful gases like methane ». A inverse la logique du texte."},
{q:"According to the article, ＿＿", o:["animal agriculture doesn't lead to deforestation.","cow burps are an insignificant contributor to global warming.","we can't reduce our environmental footprint to zero so we shouldn't try to reduce it at all.","no longer eating beef reduces both methane and CO2 emissions."], a:3, t:"inférence", ex:"Remplacer le bœuf réduit l'empreinte CO2 (1 984 → 73 livres) et les animaux émettent du méthane."},
{q:"Why does the article recommend against purchasing real estate near a feedlot operation?", o:["Because animals are deprived of their freedom there.","Because the author read a children's book about pooping.","Because the animal waste produced there contaminates the surrounding soil and groundwater.","Because the USDA doesn't allow it."], a:2, t:"cause", ex:"Les « manure lagoons » fuient et contaminent sols et nappes phréatiques."},
{q:"According to the article, ＿＿", o:["We can keep consuming the same amount of animal products we currently eat, even with the growing world population.","We grow more plants for human consumption than for animal consumption.","Cow's milk requires more than ten times the amount of water pea and oat milk do.","Plant-based egg alternatives and chicken eggs require the same amount of water."], a:2, t:"chiffres", ex:"120 L contre 1,9 L (pois) et 10 L (avoine) : plus de 10 fois plus. B est faux : 127,4 M d'acres pour le bétail contre 77,3 M."}
]},
{id:"V2", title:"Reading — Part II", instr:"Read the passage and select the best answer to each question.", pts:2,
passage:"If you've ever emerged from the shower or returned from walking your dog with a clever idea or a solution to a problem you'd been struggling with, it may not be a fluke.\nRather than constantly grinding away at a problem or desperately seeking a flash of inspiration, research from the last 15 years suggests that people may be more likely to have creative breakthroughs when they're doing a habitual task that doesn't require much thought—an activity in which you're basically on autopilot. This lets your mind wander or engage in spontaneous cognition or \"stream of consciousness\" thinking, which experts believe helps retrieve unusual memories and generate new ideas.\n\"People always get surprised when they realize they get interesting, novel ideas at unexpected times because our cultural narrative tells us we should do it through hard work,\" says Kalina Christoff, a cognitive neuroscientist at the University of British Columbia.\nNow we're beginning to understand why these clever thoughts occur during more passive activities and what's happening in the brain. The key is a pattern of brain activity—within what's called the default mode network—that occurs while an individual is resting or performing habitual tasks.\nResearchers have shown that the default mode network (DMN)—which connects more than a dozen regions of the brain—becomes more active during mind-wandering or passive tasks than when you're doing something that demands focus. Simply put, the DMN is \"the state the brain returns to when you're not actively engaged,\" explains Roger Beaty of Penn State University. By contrast, when you're mired in a demanding task, the brain's executive control systems keep your thinking focused, analytical, and logical.\nWhile the DMN plays a key role in the creative process, \"it's not the only important network,\" Beaty says. \"Other networks come into play as far as modifying, rejecting, or implementing ideas.\"\nThere's deliberate mind-wandering, where you try to exercise some control or direction to your thinking; and spontaneous mind-wandering, which happens without us directing it. It's the spontaneous form, in particular, that allows you to combine information and ideas in new ways. \"Sometimes you have to do the work to create a problem space—that sets the groundwork for spontaneous ideas to emerge,\" Schooler adds.\nThis is often referred to as \"the incubation effect,\" which occurs when you spend time away from a particular problem and your mind has the chance to wander and generate novel ideas.\n\"You need that exploratory aspect of idea generation in order to be creative,\" says Rex Jung. But you need other parts of your brain to pick an idea, evaluate its viability, and implement it. \"It's an interplay or dance between the default mode network and the cognitive control network that allows you to generate a creative idea then implement it effectively.\"",
items:[
{q:"Based on the text, which statement is TRUE?", o:["Chances of having an epiphany are higher when you're grinding away at a problem.","Stream of consciousness thinking helps you come up with new ideas.","Researchers have been desperately seeking a flash of inspiration for the last 15 years.","Research is a habitual task you can do on autopilot."], a:1, t:"paraphrase", ex:"Le stream of consciousness « helps retrieve unusual memories and generate new ideas »."},
{q:"Based on the text, which of the following is FALSE?", o:["Our culture teaches us to try and come up with new ideas through hard work.","People don't expect to come up with new ideas when relaxing.","Scientists still have no idea why we come up with new ideas during passive activities.","A pattern of brain activity in the DMN helps explain why we come up with new ideas during passive activities."], a:2, t:"FALSE", ex:"Le texte dit « we're beginning to understand why » : C est donc faux. Attention aux questions FALSE."},
{q:"Based on the text, which of the following is TRUE?", o:["The DMN is a specific region of the brain.","The DMN is more active during demanding tasks.","The DMN is the brain's executive control system.","The DMN is the default state our brain returns to when we're resting."], a:3, t:"définition", ex:"« The state the brain returns to when you're not actively engaged ». A est faux : il relie plus d'une douzaine de régions."},
{q:"Based on the text, which of the following is FALSE?", o:["We don't control where our thoughts go when we engage in spontaneous mind wandering.","We need to engage in deliberate rather than spontaneous mind wandering to come up with new ideas.","Spending time away from a problem can help us solve that problem.","When mind wandering, we combine information and ideas in new ways."], a:1, t:"FALSE", ex:"C'est la forme SPONTANÉE qui aide à combiner les idées : B est faux."},
{q:"Based on the text, which of the following is TRUE?", o:["The DMN helps you implement ideas.","Mind wandering helps you evaluate the viability of ideas.","Mind wandering helps you create a problem space.","To generate and implement an idea the DMN and cognitive control network need to collaborate."], a:3, t:"conclusion", ex:"Dernière phrase : « an interplay or dance between the DMN and the cognitive control network »."}
]}
]});

passage:"People who can't apologize appear to be tough individuals who refuse to (1). But they don't do this because they're strong — it's because they're weak.\nBut what about the people who can never admit they've misstepped, no matter the circumstance? What makes them (2) of apologizing even when they're obviously in the wrong? For these people, admitting wrongdoing and offering an apology is too psychologically (3). Offering an apology implies that they've harmed another person in some way, which can elicit feelings of (4).\nPeople who cannot apologize often have such deep feelings of low self-worth that their fragile egos cannot absorb the blow of admitting they were wrong. So their defense mechanisms (5) — at times, unconsciously — and they may externalize any blame and even dispute basic facts to ward (6) the threat of having to lower themselves by offering an apology. When they (7) on their wrongness by blaming circumstances, denying the facts, or attacking the other person, non-apologizers can make themselves feel empowered rather than diminished.\n(8), many of us mistakenly interpret these people's fragility-driven defensiveness as a sign of psychological strength.\nPsychologically speaking, admitting that we're wrong is emotionally uncomfortable. In order to take responsibility and apologize, our self-esteem needs to be strong enough for us to absorb that discomfort.\nBut if our self-esteem is (9) high but actually fragile, that ding can pierce through our defensive walls and score a direct hit to our ego. Indeed, as a rule of psychological thumb, (10) rigid one's defense mechanisms are, the more fragile the ego they're protecting.",
