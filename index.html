{id:"V1", title:"Reading — Part I", instr:"Read the passage and select the best answer to each question.", pts:2,
passage:"Not long ago, when I was somewhere in my mid-40s, I drove to Cambridge, Massachusetts, from Cape Cod and parked my car in a garage. I was scheduled to give a talk a couple of blocks away and had hoped to arrive earlier. Normally I take a photo of the floor number or the row letter whenever I park in a garage. But worried I was late, I raced out of there without getting a photo and, worse, without consciously registering where I had parked.\nI arrived on time, gave my 45-minute talk, answered questions and signed books. When I returned to the garage, I walked to where I thought I had parked, but my car wasn't there. I paced up and down ramps, becoming increasingly frustrated and hopeless.\nI knew I was in the right garage, but that's all. I was just about to report my car stolen when I stumbled upon it in 4B.\nRelieved, embarrassed and sweating, I wanted to blame the whole experience on my memory, but the neuroscientist in me knew better. I couldn't find my car not because I had a horrible memory, amnesia, dementia or Alzheimer's — I couldn't find my car because I never paid attention to where I had parked it in the first place.\nYour memory isn't a video camera, recording a constant stream of every sight and sound you're exposed to — you can only capture and retain what you pay attention to. And since you can't pay attention to everything, you'll be able to remember some aspects of what is happening before you but not others.\nThis information is converted into signals that travel to your visual cortex at the back of your brain, where the image is processed and actually seen. It can then be further processed in other brain regions for recognition, meaning, comparison, emotion and opinion. But unless you add your attention, the activated neurons will not be linked, and a memory will not be formed.\nThe number-one reason for forgetting what you just heard, a person's name, where you put your phone, or whether you locked the front door or not is lack of attention. So if we want to remember something, we just have to pay attention to it.",
items:[
{q:"According to the passage, the author usually ＿＿", o:["takes notes of the floor number or the row letter to remember where she parked her car.","takes a photo of the floor number or the row letter to remember where she parked her car.","parks her car in a free parking lot even if it is a couple of blocks away from the venue.","makes sure to arrive 45 minutes before the start of her talk."], a:1, t:"détail", ex:"« Normally I take a photo of the floor number or the row letter »."},
{q:"According to the passage, the author could not find her car because ＿＿", o:["she didn't take a photo of her car.","she has neurological problems.","she has a horrible memory.","she didn't pay attention to where she parked her car."], a:3, t:"cause", ex:"« Because I never paid attention to where I had parked it ». A est un piège : la photo n'est pas la vraie cause."},
{q:"In the passage, the author says our memory is ＿＿", o:["so good we can memorize everything we experience.","not designed to memorize everything, so we lose some information.","able to remember things related to ourselves but not others.","better at remembering visual information than auditory information."], a:1, t:"paraphrase", ex:"« Your memory isn't a video camera… you can only capture what you pay attention to »."},
{q:"According to the passage, ＿＿", o:["our neurons are always active and convert information into signals whenever we are awake.","the information we get is converted into neurons if we pay attention to things.","we convert information into signals and send them to the relevant part of our brain.","our neurons send visual information to the back of our brain where our memories are activated."], a:2, t:"détail", ex:"L'information est convertie en signaux envoyés au cortex visuel puis à d'autres régions."},
{q:"The main message of this passage is that ＿＿", o:["we need to pay attention to things we do not want to forget.","to avoid forgetting where you parked your car, you should take a photo.","we are exposed to vast amounts of information every day.","you should not try to memorize everything you see or hear."], a:0, t:"idée principale", ex:"Dernière phrase : pour se souvenir, il faut faire attention."}
]},
{id:"V2", title:"Reading — Part II", instr:"Read the passage and select the best answer to each question.", pts:2,
passage:"Those fond of books on language may be familiar with one facet of the inherent changeability of words' meanings. It is traditionally covered that meanings have either broadened or narrowed over time. That indeed happens. Take dog, for instance. When hound was the normal word for a canine, dog was a word for a big, fierce sort of dog. Over time, it came to be used as the all-purpose word for dog. That was a classic case of semantic broadening, paralleled by the narrowing of the scope of hound, which now refers only to a dog used for hunting (Chihuahuas aren't hounds).\nMany words have narrowed under the radar, in certain usages. \"Does he drink?\" is a question about alcohol, not whether the person imbibes liquids in general. In the old days the question \"Do you like music?\" referred to classical music. That assumption is now antique, but lives on in how readily a book on classical music can be titled as about \"music\" as if Brahms and Schoenberg are somehow the default conception of music, with rock, jazz, hiphop, Peruvian huayno music, and Indian ragas somehow not \"music music.\"\nMore subtly, today's discussions about the value of \"reading\" presuppose that the topic is fiction. In this vein, \"language\" in the conception of most people brings the printed word to mind first, with speech considered an afterthought. Hence questions such as \"What is texting doing to language?\" despite that it would be impossible to speak with capital letters or to utter a sequence of emoticons.\nHowever, broadening and narrowing alone do not convey the essence of the matter. Meat, say, was first used to refer to all food (hence candy being called sweetmeat) but narrowed to refer to flesh. Yet in reality the main meal, so to speak, is plain old drift, where the issue is less broadening or narrowing than simply transformation. Words have a way of just oozing around. Bird is an example. It started as a word meaning a baby animal, but later became the word for flying animals. That's a lateral shift – neither more nor less specific, just different. A word we utter is usually just the latest stage in tens of millennia of drifting from one meaning into another.",
items:[
{q:"According to the passage, the animal we now call \"dog\" used to be called", o:["hound.","dog as well.","canine.","chihuahua."], a:0, t:"détail", ex:"« When hound was the normal word for a canine »."},
{q:"In the passage, the word \"music music\" refers to", o:["music in general.","music composed by Brahms and Schoenberg.","the default conception of music.","music such as rock and hip-hop."], a:2, t:"inférence", ex:"« Music music » = la conception par défaut de la musique (le classique). C est plus juste que B, qui n'en donne que des exemples."},
{q:"According to the passage, which of the following statements is TRUE?", o:["Most people believe that fiction is the most valuable reading material.","Most people believe that writing is primary and speaking is secondary.","Most people believe that the use of emoticons is now a social problem.","Most people believe books about the cosmos are fiction."], a:1, t:"inférence", ex:"« Language… brings the printed word to mind first, with speech considered an afterthought »."},
{q:"Which of the following statements is FALSE?", o:["The change in meaning of the word \"meat\" is an example of semantic narrowing.","The change in meaning of the word \"bird\" is an example of a lateral shift.","The change in meaning of \"language\" (in \"What is texting doing to language?\") is an example of semantic narrowing.","The change in meaning of \"drink\" (in \"Does he drink?\") is an example of semantic broadening."], a:3, t:"FALSE", ex:"« Drink » s'est restreint (narrowing) à l'alcool, pas élargi."},
{q:"Which of the following statements is FALSE?", o:["Semantic meanings evolve according to certain rules, so we can predict what words will mean in the future.","\"Sweetmeat\" is another word for \"candy\".","Some words, which used to refer to a narrower concept, start to refer to broader concepts.","Words change meaning continuously over time."], a:0, t:"FALSE", ex:"Le texte insiste sur la dérive imprévisible (drift, oozing around) : A est faux."}
]}
]});

// Mini-cours sur les notions qui reviennent le plus dans les annales MEXT 2023-2025
const LESSONS = [
{id:"en-strat", subj:"en", k:"策", title:"Stratégie de l'épreuve d'anglais (60 min)", mins:5, tags:[], html:`
<p>L'épreuve English (A) est <b>identique chaque année</b> : 5 parties, 50 questions, 100 points.</p>
<table><tr><th>Partie</th><th>Contenu</th><th>Points</th><th>Temps conseillé</th></tr>
<tr><td>I</td><td>Vocabulaire en contexte (10)</td><td>20</td><td>7 min</td></tr>
<tr><td>II</td><td>Grammaire en contexte (10)</td><td>20</td><td>7 min</td></tr>
<tr><td>III</td><td>Trouver l'erreur (10)</td><td>20</td><td>12 min</td></tr>
<tr><td>IV</td><td>Texte à trous (10)</td><td>20</td><td>10 min</td></tr>
<tr><td>V</td><td>2 textes, 5 questions chacun</td><td>20</td><td>20 min</td></tr></table>
<p>Il reste ~4 min pour vérifier. <b>Toutes les parties valent pareil</b> : ne reste jamais bloqué sur une question.</p>
<h4>Les 5 règles d'or</h4>
<ol><li><b>Partie III</b> : cherche d'abord les 5 pièges classiques — accord sujet/verbe, their/there/they're, adjectif au lieu d'adverbe, mauvaise préposition, verbe mal conjugué.</li>
<li><b>Partie V</b> : lis les questions AVANT le texte. Repère les mots NOT / FALSE / TRUE en majuscules.</li>
<li>Les réponses avec <i>always, never, solely, only, straight</i> sont souvent fausses.</li>
<li>La bonne réponse paraphrase le texte, elle ne le copie presque jamais mot pour mot.</li>
<li>Ne laisse aucune case vide : il n'y a pas de pénalité.</li></ol>`},
{id:"en-colloc", subj:"en", k:"連", title:"Collocations qui tombent souvent", mins:6, tags:["collocations","idiomes"], html:`
<p>La partie I teste surtout des <b>mots qui vont ensemble</b>. On ne peut pas les deviner par la logique : il faut les avoir vus.</p>
<h4>Vus dans les annales</h4>
<ul><li>copyright <b>infringement</b> · a <b>defining</b> issue · <b>heavy</b> traffic</li>
<li>the constant <b>topic</b> of conversation · become a <b>reality</b> · <b>call</b> it a day</li>
<li><b>ability</b> to read · an <b>only</b> child · <b>arguably</b> the greatest</li>
<li><b>sit tight</b> · challenges <b>ahead</b> · <b>recognized as</b></li>
<li><b>complete</b> a questionnaire · become a <b>part</b> of our lives</li></ul>
<h4>À connaître aussi (même style)</h4>
<ul><li>make a mistake / a decision / progress — do research / homework / harm</li>
<li>pay attention · take responsibility · raise awareness · meet a deadline</li>
<li>conduct a survey · play a role in · draw a conclusion · bridge the gap</li></ul>
<p class="tip">Astuce : lis toute la phrase. Le mot qui suit le blanc (<i>of, to, for</i>) élimine souvent 2 réponses.</p>`},
{id:"en-phrasal", subj:"en", k:"句", title:"Phrasal verbs essentiels", mins:5, tags:["phrasal verbs"], html:`
<p>Ils reviennent en parties I et IV. Retiens le <b>sens</b>, pas la traduction mot à mot.</p>
<table><tr><th>Verbe</th><th>Sens</th></tr>
<tr><td>wipe out</td><td>anéantir</td></tr><tr><td>back down</td><td>céder</td></tr>
<tr><td>kick in</td><td>se déclencher</td></tr><tr><td>ward off</td><td>repousser (une menace)</td></tr>
<tr><td>double down on</td><td>s'entêter, insister</td></tr><tr><td>go up for auction</td><td>être mis aux enchères</td></tr>
<tr><td>engage with</td><td>interagir avec</td></tr><tr><td>marry someone off</td><td>marier quelqu'un</td></tr>
<tr><td>come in (colors, flavors)</td><td>exister en</td></tr><tr><td>chip in</td><td>contribuer</td></tr>
<tr><td>spill the beans</td><td>vendre la mèche</td></tr><tr><td>turn a blind eye</td><td>fermer les yeux</td></tr></table>`},
{id:"en-prep", subj:"en", k:"前", title:"Prépositions pièges", mins:6, tags:["prépositions"], html:`
<h4>Temps</h4>
<ul><li><b>during</b> + nom (during the pandemic) ≠ <b>while</b> + sujet + verbe (while it was raining)</li>
<li><b>by</b> = au plus tard (due by October 17) ≠ <b>until</b> = jusqu'à, de façon continue</li>
<li><b>for</b> + durée (for seven months) ≠ <b>since</b> + point de départ (since 2020)</li>
<li><b>ahead of</b> its opening = avant l'ouverture</li></ul>
<h4>Préposition imposée par le mot</h4>
<ul><li>an alternative <b>to</b> · capable <b>of</b> · replace X <b>with</b> Y · describe X <b>as</b> Y</li>
<li>the relationship <b>between</b> · engage <b>with</b> · proud <b>of</b> · depend <b>on</b></li></ul>
<p class="tip">Si tu hésites entre during et while, regarde s'il y a un verbe juste après le blanc.</p>`},
{id:"en-rel", subj:"en", k:"関", title:"Pronoms relatifs", mins:4, tags:["pronoms relatifs"], html:`
<ul><li><b>who</b> : une personne, sujet (workers <b>who</b> received…)</li>
<li><b>whom</b> : une personne, complément (rare, formel)</li>
<li><b>which / that</b> : une chose (a problem <b>that</b> it contributes to)</li>
<li><b>whose</b> : possession, « dont le / la » (women <b>whose</b> textiles…)</li>
<li><b>where</b> : un lieu (the university <b>where</b> he earned…)</li></ul>
<p class="tip">Piège 2025 : « those » n'est jamais un pronom relatif.</p>`},
{id:"en-agree", subj:"en", k:"一", title:"Accord sujet / verbe", mins:5, tags:["accord"], html:`
<p>C'est l'erreur n°1 de la partie III. Trouve le <b>vrai sujet</b>, même s'il est loin du verbe.</p>
<ul><li>A crisis that affects borrowers… <b>is</b> (pas are)</li>
<li>A series of articles <b>reports</b></li>
<li>two men who <b>are</b> · paintings, which <b>were</b></li>
<li>one of the + nom <b>pluriel</b> : one of the destinations</li></ul>
<p class="tip">Méthode : barre mentalement tout ce qui est entre virgules ou après « that / who ». Le sujet réapparaît.</p>`},
{id:"en-homo", subj:"en", k:"音", title:"Homophones et confusions", mins:3, tags:["homophones","make / do","say / tell"], html:`
<p>Ces fautes tombent <b>tous les ans</b> en partie III (2023, 2024 et 2025).</p>
<ul><li><b>their</b> (leur) · <b>there</b> (là) · <b>they're</b> (they are)</li>
<li><b>too</b> (trop) · <b>two</b> (deux) · <b>to</b></li>
<li><b>make</b> a mistake (jamais do a mistake)</li>
<li><b>tell</b> me · <b>say</b> to me (jamais said me)</li></ul>`},
{id:"en-adv", subj:"en", k:"副", title:"Adjectif ou adverbe ?", mins:4, tags:["adjectif / adverbe","formation des mots"], html:`
<ul><li>Un verbe se modifie avec un <b>adverbe</b> : grew <b>quickly</b>.</li>
<li>Un adjectif se modifie avec un <b>adverbe</b> : <b>linguistically</b> interesting.</li>
<li>Un comparatif aussi : <b>considerably</b> less.</li>
<li>Un nom se modifie avec un <b>adjectif</b> : <b>different</b> situations.</li></ul>
<p>Suffixes utiles : -tion / -ment / -ity (nom) · -ive / -al / -ous (adjectif) · -ly (adverbe).</p>`},
{id:"en-verb", subj:"en", k:"動", title:"Temps, passif, infinitif ou gérondif", mins:7, tags:["temps verbaux","voix passive","infinitif / gérondif","verbes irréguliers","modaux","participes"], html:`
<h4>Temps</h4><ul><li>Vérité générale → présent simple (they <b>come in</b> varying flavors)</li><li>Passé terminé (as a teen) → prétérit (never <b>had</b>)</li><li>has + participe passé : has <b>come</b> (pas came)</li></ul>
<h4>Passif</h4><ul><li>Le sujet subit l'action : the research <b>is described</b>, you'll <b>be rewarded</b> with</li></ul>
<h4>Infinitif ou -ing</h4><ul><li>expect / want someone <b>to</b> do · struggle <b>to</b> do · be likely <b>to</b></li><li>capable <b>of doing</b> · incapable <b>of</b> apologizing</li></ul>
<h4>Irréguliers piégeux</h4><ul><li>lie (s'allonger) – <b>lay</b> – lain · lay (poser) – laid – laid</li></ul>
<h4>Modaux</h4><ul><li>must not = interdiction · might not = possibilité · could = capacité passée</li></ul>`},
{id:"en-read", subj:"en", k:"読", title:"Lecture : TRUE, FALSE, NOT mentioned", mins:6, tags:["idée principale","détail","paraphrase","FALSE","NOT mentioned","inférence","chiffres","cause","définition","conclusion"], html:`
<ol><li>Lis la <b>question</b>, puis cherche la zone du texte qui en parle.</li>
<li><b>TRUE</b> : la bonne réponse reformule le texte. Méfie-toi des mots extrêmes.</li>
<li><b>FALSE</b> : trois options sont vraies, une contredit le texte. Coche chaque option vérifiée.</li>
<li><b>NOT mentioned</b> : l'option peut être plausible mais absente du texte (ex. 2025 : tuition fees).</li>
<li><b>Chiffres</b> : vérifie à quoi se rapporte chaque chiffre (2025 : 3,5 % → 8 % = abandons, pas santé mentale).</li></ol>
<p class="tip">Les textes parlent de science, de société et d'éducation : lire des articles de BBC Future ou The Guardian 10 min par jour est le meilleur entraînement.</p>`},
{id:"ja-strat", subj:"ja", k:"策", title:"Stratégie de l'épreuve de japonais (100 min)", mins:5, tags:[], html:`
<p>Le sujet 日本語 (A) mélange <b>tous les niveaux</b> : les premières questions sont de niveau N5, les dernières de niveau N1.</p>
<ul><li><b>I</b> : remplir le blanc (grammaire / vocabulaire) — 15 à 17 questions</li>

<p><b>Ta stratégie de débutant</b> : sécurise les questions 1 à 6 de chaque partie (niveau N5-N4). Ce sont tes points garantis. Pour la fin de chaque partie, élimine et tente ta chance : pas de pénalité.</p>
<p class="tip">En 2023, il y avait 3 niveaux au choix (A débutant, B intermédiaire, C avancé). Vérifie le format de l'année auprès de l'Ambassade.</p>`},

{id:"ja-kanji", subj:"ja", k:"漢", title:"Méthode pour la partie kanji", mins:5, tags:["kanji"], html:`

<li>Pour chaque option, trouve le mot complet (ex. 給<b>よ</b> → 給与).</li>
<li>Choisis celle qui contient <b>le même caractère</b>, pas seulement la même lecture.</li></ol>
<p>Paires vues dans les annales : 乾かす→乾杯 · 確かめる→正確 · 巻→巻く · 解く→解決 · 受験→引き受ける · 揺れ→動揺 · 干す→梅干し · 選挙→一挙 · 漏れる→漏電 · 悟る→覚悟 · 与える→給与 · 庭→家庭 · 換える→交換 · 溶ける→溶岩 · 防ぐ→消防 · 端→極端 · 素顔→素材 · 厳か→厳密 · 焦点→焦げる · 中継→継ぐ.</p>
<p class="tip">Un kanji a souvent une lecture japonaise (くん) et une lecture chinoise (おん) : 防 = ふせぐ / ぼう.</p>`},
{id:"ja-keigo", subj:"ja", k:"敬", title:"Keigo et formules pour l'entretien", mins:5, tags:["keigo","conversation","expressions"], html:`
<ul><li>召し上がる = manger (respectueux) · いただく = manger, recevoir (humble)</li>
<li>かしこまりました = bien compris (humble) · おかげさまで = grâce à vous</li>
<li>〜させてください = permettez-moi de · お先に失礼します = je pars avant vous</li>
<li>ごちそうさまでした (fin du repas) · おだいじに (prenez soin de vous)</li></ul>
<h4>Phrases utiles à l'entretien</h4>
<ul><li>はじめまして。ブルキナファソから参りましたモハメドと申します。</li>
<li>どうぞよろしくお願いいたします。</li><li>日本語はまだ勉強中ですが、毎日練習しています。</li>
<li>本日はありがとうございました。</li></ul>`},
{id:"int-method", subj:"int", k:"話", title:"Réussir l'entretien de l'Ambassade", mins:7, tags:[], html:`
<p>L'entretien dure en général 15 à 30 minutes, en anglais, parfois avec une ou deux questions en japonais. Le jury veut vérifier trois choses :</p>
<ol><li><b>Ton projet de recherche</b> est clair, faisable et utile.</li><li><b>Pourquoi le Japon</b>, et pourquoi ce domaine.</li><li><b>Ta capacité à vivre et réussir</b> au Japon, puis à servir de pont avec le Burkina Faso.</li></ol>
<h4>La structure de réponse PREP</h4>
<ul><li><b>P</b>oint : ta réponse en une phrase</li><li><b>R</b>aison : pourquoi</li><li><b>E</b>xemple : un fait concret de ton parcours</li><li><b>P</b>oint : reformule et relie à ton projet</li></ul>
<p class="tip">Vise 45 à 90 secondes par réponse. Ton expérience chez Educ'Assure (orientation d'étudiants, marketing) est un atout : utilise-la comme exemple.</p>`},
{id:"int-plan", subj:"int", k:"計", title:"Construire ton plan de recherche", mins:6, tags:[], html:`
<p>Le « Field of Study and Research Plan » fait 2 à 3 pages. Il guide tout l'entretien.</p>
<ol><li><b>Titre</b> précis (ex. : marketing digital et confiance des consommateurs dans les PME d'Afrique de l'Ouest).</li>
<li><b>Contexte</b> : le problème au Burkina Faso, chiffres à l'appui.</li><li><b>Question de recherche</b> et objectifs.</li>
<li><b>Méthode</b> : enquêtes, études de cas, comparaison avec le Japon.</li><li><b>Pourquoi le Japon</b> : professeur, laboratoire, expertise japonaise.</li>
<li><b>Impact</b> au retour : comment tu appliqueras les résultats.</li></ol>
<p class="tip">Contacte 2 ou 3 professeurs japonais dès maintenant : citer un professeur précis est un vrai plus à l'entretien.</p>`}
];

}

const BOX = [0, 1, 3, 7, 16, 35];
function record(id, ok) {
  const r = S.items[id] || {c: 0, w: 0, b: 0, d: today()};
  if (ok) { r.c++; r.b = Math.min(r.b + 1, BOX.length - 1); r.d = addDays(today(), BOX[r.b]); }
  else { r.w++; r.b = 0; r.d = today(); }
  r.l = today(); S.items[id] = r;
  const d = S.days[today()] || {n: 0, xp: 0};
  d.n++; const gain = ok ? 10 : 2; d.xp += gain; S.xp += gain; S.days[today()] = d;
}
function addXp(n) { const d = S.days[today()] || {n: 0, xp: 0}; d.xp += n; S.xp += n; S.days[today()] = d; }
function streak() {
  let n = 0, d = today();
  if (!(S.days[d] && S.days[d].n)) d = addDays(d, -1);
  while (S.days[d] && S.days[d].n) { n++; d = addDays(d, -1); }
  return n;
}
const dueIds = () => ORDER.filter(id => S.items[id] && S.items[id].b < BOX.length - 1 && S.items[id].d <= today() && S.items[id].w > 0);
function tagStats() {
  return Object.keys(TAGS).map(t => { let c = 0, w = 0; TAGS[t].forEach(id => { const r = S.items[id]; if (r) { c += r.c; w += r.w; } }); return {t, c, w, n: c + w, acc: c + w ? c / (c + w) : null, total: TAGS[t].length}; });
}
function bestExam(subj) { const xs = S.exams.filter(e => e.subj === subj); return xs.length ? Math.max(...xs.map(e => Math.round(e.score / e.max * 100))) : null; }
function readiness() {
  const ids = ORDER; const mastered = ids.filter(id => S.items[id] && S.items[id].b >= 2).length / ids.length;
  const en = bestExam("en"), ja = bestExam("ja");
  const exam = ((en || 0) + (ja || 0)) / 200;
  const iv = Object.values(S.interview).filter(x => typeof x.score === "number");
  const ivs = iv.length ? iv.reduce((a, x) => a + x.score, 0) / iv.length / 10 * Math.min(1, iv.length / 8) : 0;
  return Math.round((mastered * 0.4 + exam * 0.4 + ivs * 0.2) * 100);
}
function pickPractice(subj, n, rnd) {
  rnd = rnd || Math.random;
  const pool = ORDER.filter(id => ITEMS[id].subj === subj);
  const due = pool.filter(id => S.items[id] && S.items[id].d <= today() && S.items[id].w > 0);
  const weakTags = tagStats().filter(s => s.acc !== null && s.acc < 0.7).map(s => s.t);
  const weak = pool.filter(id => !S.items[id] && weakTags.includes(ITEMS[id].it.t));
  const unseen = pool.filter(id => !S.items[id]);
  const out = [];
  const take = (arr, k) => { const a = arr.slice().sort(() => rnd() - 0.5); for (const id of a) { if (out.length >= k) break; if (!out.includes(id)) out.push(id); } };
  take(due, Math.ceil(n * 0.4)); take(weak, Math.ceil(n * 0.7)); take(unseen, n); take(pool, n);
  return out.slice(0, n);
}
function mission() {

}

      if (!ok.includes(S.grokModel)) { const pref = isGroq() ? [/gpt-oss-120b/, /llama-3\.3-70b/, /llama-4-maverick/, /qwen/, /70b/] : [/fast.*non-reasoning/, /fast|mini/]; let pick = null; for (const re of pref) { pick = ok.find(i => re.test(i)); if (pick) break; } pick = pick || ok[0]; if (pick) { S.grokModel = pick; save(); } }
      toast("Clé " + AI_NAME() + " valide. Modèle : " + S.grokModel); render(); }
    catch (e) { toast("Impossible de joindre " + AI_NAME() + " depuis cette page."); } }
  else if (a === "exp") { const c = JSON.parse(JSON.stringify(S)); delete c.grokKey; const code = btoa(unescape(encodeURIComponent(JSON.stringify(c))));
    try { await navigator.clipboard.writeText(code); toast("Code copié. Colle-le dans l'autre version."); } catch (e) { const t = document.getElementById("imp"); if (t) { t.value = code; t.select(); } toast("Copie automatique impossible : le code est dans la case, copie-le à la main."); } }
  else if (a === "imp") { const t = document.getElementById("imp").value.trim(); try { const o = JSON.parse(decodeURIComponent(escape(atob(t)))); if (!o || typeof o.items !== "object") throw 0; const k = S.grokKey; S = Object.assign(freshState(), o); S.grokKey = k; save(); toast("Progression importée."); go("home"); } catch (e) { toast("Code invalide. Recopie-le en entier."); } }
  else if (a === "reset") { if (!VIEW.rc) { VIEW.rc = 1; toast("Touche encore une fois pour tout effacer."); return; } const keep = {name: S.name, field: S.field, topic: S.topic, examDate: S.examDate, plan: S.plan, grokKey: S.grokKey, grokModel: S.grokModel}; S = Object.assign(freshState(), keep); save(); toast("Progression remise à zéro."); go("home"); }
});
document.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.act === "chk") { S.check[e.target.dataset.v] = e.target.checked; save(); } });
function toggleMic() {
  if (IV.rec) { stopMic(); return; }
  const ta = document.getElementById("ans"); IV.base = ta ? ta.value.trim() : "";
  const ja = INTERVIEW[IV.list[IV.i]].c === "Japonais";
  if (CAP.dictation) {
    const d = CAP.dictation;
    d.start().catch(err => { IV.rec = false; render(); if (err && err.code === "not_granted") { CAP.dictation = null; toast("Micro refusé : écris ta réponse."); } });
    IV.rec = true;
    if (!IV.hooked) { IV.hooked = true;
      d.onPartial(({text}) => { const t = document.getElementById("ans"); if (t) t.value = (IV.base ? IV.base + " " : "") + text; });
      d.onFinal(({text}) => { IV.base = (IV.base ? IV.base + " " : "") + text; IV.text = IV.base; const t = document.getElementById("ans"); if (t) t.value = IV.base; const w = document.getElementById("wc"); if (w) w.textContent = wc(IV.base); });
      d.onState(({state}) => { if (state === "idle" && IV && IV.rec) { IV.rec = false; render(); } });
    }
    render(); return;
  }
  if (!SR) return;
  try {
    const r = new SR(); IV.sr = r; r.lang = ja ? "ja-JP" : "en-US"; r.interimResults = true; r.continuous = true;
    r.onresult = ev => { let fin = "", inter = ""; for (let k = ev.resultIndex; k < ev.results.length; k++) { const tr = ev.results[k][0].transcript; if (ev.results[k].isFinal) fin += tr; else inter += tr; }
      if (fin) { IV.base = (IV.base ? IV.base + " " : "") + fin.trim(); IV.text = IV.base; }
      const t = document.getElementById("ans"); if (t) t.value = (IV.base || "") + (inter ? " " + inter : "");
      const w = document.getElementById("wc"); if (w) w.textContent = wc(t ? t.value : IV.base); };
    r.onerror = ev => { IV.rec = false; IV.sr = null; render(); if (ev.error === "not-allowed" || ev.error === "service-not-allowed") toast("Micro refusé. Autorise-le : Réglages iPhone > Safari > Micro, et active Siri et dictée."); else if (ev.error !== "aborted" && ev.error !== "no-speech") toast("Le micro s'est arrêté (" + ev.error + "). Touche-le pour reprendre."); };
    r.onend = () => { if (IV && IV.rec) { IV.rec = false; IV.sr = null; const t = document.getElementById("ans"); if (t) IV.text = t.value; render(); } };
    r.start(); IV.rec = true; render();
  } catch (e) { toast("Micro indisponible ici. Utilise la dictée du clavier."); }
}
function stopMic() {
  if (!IV || !IV.rec) return;
  if (CAP.dictation) CAP.dictation.stop().catch(() => {});
  if (IV.sr) { try { IV.sr.stop(); } catch (e) {} }
  const t = document.getElementById("ans"); if (t) IV.text = t.value;
  IV.rec = false;
}
(function init() {
  const m = location.hash.match(/^#k=((?:gsk_|xai-)[A-Za-z0-9_-]+)/);
  if (m) { S.grokKey = m[1]; S.grokModel = ""; save(); try { history.replaceState(null, "", location.pathname); } catch (e) { location.hash = ""; } setTimeout(() => toast("Clé " + AI_NAME() + " enregistrée sur ce téléphone."), 400); }
  const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) VIEW = {name: h}; render(); })();
